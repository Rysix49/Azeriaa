<title>Amakna Idle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta id="vp" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11140e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style id="css-new" media="not all">
/* =====================================================================
   AMAKNA IDLE — INTERFACE v2
   Layout : barre latérale (marque, navigation, groupe) + contenu ;
   sur mobile, barre de navigation fixe en bas.
   Monde : sous-bois sombre d'Amakna, or des kamas, ciel des zones.
   ===================================================================== */
:root {
  --bg: #11140e; --bg-2: #171b13; --panel: #1d2218; --panel-2: #242a1e; --raise: #2d3426;
  --line: #333b2a; --line-2: #48523b;
  --fg: #f1ead6; --muted: #aaa38a; --dim: #78765f;
  --gold: #e8aa2e; --gold-2: #f6cd6a; --gold-ink: #2a1c04;
  --hp: #e0533f; --xp: #5cc0ad; --win: #93cf5f; --warn: #e6a93c;
  --terre: #c58f55; --feu: #e8653f; --eau: #55a8ea; --air: #74c552; --sag: #b48ae3; --vit: #eccb52;
  --stasis: #9156e6; --stasis-bg: #261640; --stasis-fg: #dcc0ff; --relic: #ffe14d;
  --q-low: #8f8c78; --q-mid: #ddd5bd; --q-high: #f6cd6a;
  --f-display: 'Grenze', 'Palatino Linotype', Georgia, serif;
  --f-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --r: 14px; --side: 244px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--f-body); font-size: 14px; line-height: 1.45; min-height: 100%;
  background:
    radial-gradient(1200px 700px at 85% -10%, #e8aa2e12, transparent 60%),
    radial-gradient(900px 600px at -10% 110%, #5cc0ad0d, transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--f-display); font-weight: 600; letter-spacing: .2px; }
.sub { color: var(--muted); font-size: 12.5px; }
.hint { color: var(--dim); font-size: 12px; margin: 0; }
.dim { color: var(--dim); }
.lvl { color: var(--gold-2); font-weight: 800; }
.label { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 800; }
.grow { flex: 1; }
.ic { width: 20px; height: 20px; flex: none; }

/* ---------- Coquille ---------- */
#app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  padding-block: 18px 16px; padding-right: 12px; padding-left: max(12px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, #1a1f15, #12160f); border-right: 1px solid var(--line);
  scrollbar-width: thin;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 0; }
.egg { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 3px 4px #0009); }
.brand b { display: block; font-size: 28px; line-height: .9; color: var(--gold-2); text-shadow: 0 2px 0 #0009; }
.brand small { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-weight: 800; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-btn {
  position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
  border: 0; background: none; color: var(--muted); font-weight: 800; font-size: 14px; text-align: left;
  transition: background .12s, color .12s;
}
.nav-btn:hover { background: #ffffff08; color: var(--fg); }
.nav-btn[aria-current="true"] { background: linear-gradient(90deg, #e8aa2e2a, #e8aa2e06); color: var(--gold-2); }
.nav-btn[aria-current="true"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--gold); }

.party { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.party-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 2px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 800; }
.pm {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 8px; border-radius: 10px; border: 1px solid transparent; background: #ffffff05; text-align: left;
}
.pm:hover { border-color: var(--line-2); }
.pm.on { border-color: color-mix(in srgb, var(--c) 60%, transparent); background: color-mix(in srgb, var(--c) 13%, transparent); }
.pm-t { min-width: 0; display: flex; flex-direction: column; }
.pm-t b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-pts { font-style: normal; display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-size: 11px; font-weight: 900; vertical-align: 1px; }
.pst { font-size: 11px; color: var(--muted); display: flex; gap: 5px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pst::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: none; }
.pst.fighting::before { background: var(--hp); box-shadow: 0 0 6px var(--hp); }
.pst.resting::before { background: var(--xp); }
.pst.harvest::before { background: var(--win); }
.pm-hp { display: block; height: 3px; background: #0007; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.pm-hp i { display: block; height: 100%; background: var(--hp); transition: width .2s linear; }
.pm .lvl { font-size: 12px; }
.pm.add { grid-template-columns: 30px minmax(0, 1fr); border-style: dashed; border-color: var(--line-2); background: none; }
.plus { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 1px dashed var(--gold); color: var(--gold-2); font-weight: 900; }
.pm.add b { color: var(--gold-2); }
.pm.add small { font-size: 11px; color: var(--muted); }

.page { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 16px;
  padding-block: 14px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.tb-brand { display: none; }
.tb-brand .egg { width: 30px; height: 30px; }
.tb-title { flex: 1; min-width: 0; }
.tb-title h1 { margin: 0; font-size: 28px; line-height: 1; }
.tb-title p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
.wallet { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.wchip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.wchip small { color: var(--muted); font-size: 11.5px; font-weight: 700; }
.wchip.gold { border-color: #e8aa2e66; background: linear-gradient(180deg, #332c16, #231f11); }
.wchip.gold b { color: var(--gold-2); font-size: 14px; }
.kama {
  width: 15px; height: 15px; border-radius: 50%; display: inline-block; flex: none;
  background: radial-gradient(circle at 35% 35%, var(--gold-2), var(--gold) 55%, #9c6a10);
  box-shadow: inset 0 0 0 1.5px #7a5208;
}
.kamas { display: inline-flex; align-items: center; gap: 5px; }
main { width: 100%; max-width: 1440px; padding-block: 22px 40px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.foot { color: var(--dim); font-size: 11.5px; text-align: center; padding-block: 0 28px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 90ch; margin: 0 auto; }

.bottom-nav {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  background: #151911f2; backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
}
.bottom-nav .nav-btn { flex-direction: column; gap: 3px; padding: 6px 2px; font-size: 10.5px; justify-content: center; text-align: center; border-radius: 8px; min-width: 0; }
.bottom-nav .nav-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bottom-nav .nav-btn[aria-current="true"]::before { left: 28%; right: 28%; top: -7px; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .bottom-nav { display: grid; }
  .tb-brand { display: flex; }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; padding-block: 10px; }
  .tb-title h1 { font-size: 22px; }
  .tb-title p { display: none; }
  .hide-sm { display: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); padding-top: 16px; }
  .foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- Boutons & contrôles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  border: 1px solid var(--line-2); background: var(--raise); color: var(--fg);
  padding: 8px 14px; border-radius: 9px; font-weight: 800; font-size: 13px;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, #f8d77c, #e5a52a); color: var(--gold-ink); border-color: #b9800f; box-shadow: 0 1px 0 #fff6 inset, 0 2px 0 #6e4a07; }
.btn.gold:hover:not(:disabled) { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: #8a3a2e; color: #f6b0a2; background: #34170f; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
.btn.lg { padding: 11px 22px; font-size: 15px; border-radius: 11px; }
.link { background: none; border: 0; padding: 0; color: var(--gold-2); font-weight: 800; text-decoration: underline dotted; text-underline-offset: 2px; }
select, input[type="text"], textarea { background: var(--bg-2); color: var(--fg); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; font: inherit; max-width: 100%; }
textarea { width: 100%; min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; resize: vertical; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; border-radius: 11px; background: #00000045; border: 1px solid var(--line); align-self: flex-start; }
.seg button { border: 0; background: none; color: var(--muted); padding: 6px 13px; border-radius: 8px; font-weight: 800; font-size: 12.5px; }
.seg button:hover:not(:disabled) { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--gold-2); box-shadow: 0 1px 0 #ffffff12 inset, 0 1px 3px #0006; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.toggle { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--muted); font-weight: 700; font-size: 12.5px; padding: 4px 0; }
.toggle .tg { width: 34px; height: 20px; border-radius: 10px; background: #00000060; border: 1px solid var(--line-2); position: relative; transition: background .15s; }
.toggle .tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle[aria-pressed="true"] { color: var(--fg); }
.toggle[aria-pressed="true"] .tg { background: #93cf5f40; border-color: #93cf5f88; }
.toggle[aria-pressed="true"] .tg::after { transform: translateX(14px); background: var(--win); }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #ffffff0c; border: 1px solid #ffffff0a; }
.chip small { color: var(--dim); }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 900; padding: 2px 7px; border-radius: 5px; background: #ffffff12; color: var(--muted); }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
.row-btns.left { justify-content: flex-start; }

/* ---------- Panneaux ---------- */
.panel {
  background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 1px 0 #ffffff08 inset, 0 12px 30px #00000040;
}
.panel h3.display { margin: 0; font-size: 21px; line-height: 1.1; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-h h3 .lvl { font-family: var(--f-body); font-size: 13px; margin-left: 6px; }
.list-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.empty { color: var(--muted); padding: 32px 16px; text-align: center; border: 1px dashed var(--line-2); border-radius: 12px; }
.empty.sm { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; }
.hint-band { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; border: 1px dashed var(--line-2); color: var(--muted); }

/* ---------- Barres ---------- */
.bar { height: 10px; border-radius: 6px; background: #00000060; overflow: hidden; position: relative; border: 1px solid #00000050; }
.bar > i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: 6px; transition: width .2s linear; }
.bar.hp > i { background: linear-gradient(180deg, #f27a63, var(--hp)); }
.bar.xp > i { background: linear-gradient(180deg, #86dccb, var(--xp)); }
.bar.job > i { background: linear-gradient(180deg, var(--gold-2), var(--gold)); }
.bar.thin { height: 6px; }

/* ---------- Emblèmes ---------- */
.emblem {
  --s: 44px; width: var(--s); height: var(--s); flex: none; display: grid; place-items: center; position: relative; border-radius: 50%; color: #fff6dc;
  background:
    radial-gradient(circle at 32% 26%, color-mix(in srgb, var(--c) 45%, white) 0%, transparent 42%),
    radial-gradient(circle at 50% 60%, var(--c) 30%, color-mix(in srgb, var(--c) 45%, black) 100%);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 55%, black), inset 0 0 0 4px color-mix(in srgb, var(--gold-2) 55%, transparent),
    inset 0 -6px 10px #00000055, 0 0 0 1.5px #0008, 0 3px 10px color-mix(in srgb, var(--c) 45%, transparent);
}
.emblem svg { width: 58%; height: 58%; filter: drop-shadow(0 1.5px 0 #0009); overflow: visible; }
.emblem.sm { --s: 30px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 55%, black), inset 0 0 0 3px color-mix(in srgb, var(--gold-2) 50%, transparent), 0 0 0 1px #0008; }
.emblem.big { --s: 60px; }
.emblem.xl { --s: 88px; }
.emblem.xl::after, .hero.active .emblem.big::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--c) 65%, transparent); opacity: .8; }
.hero.active .emblem.big { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 55%, black), inset 0 0 0 4px var(--gold-2), 0 0 0 1.5px #0008, 0 0 22px var(--c); } }

/* ---------- Statuts ---------- */
.status { font-size: 10.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 7px; background: #00000045; color: var(--muted); white-space: nowrap; }
.status.fighting { color: #ff9a87; background: #e0533f22; }
.status.resting { color: var(--xp); background: #5cc0ad1c; }
.status.harvest { color: var(--win); background: #93cf5f1c; }
.status.idle { color: var(--dim); }

/* ---------- Combats ---------- */
.fights { display: flex; flex-direction: column; gap: 18px; }
.fc {
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border-top: 3px solid color-mix(in srgb, var(--c) 75%, var(--line)); box-shadow: 0 12px 30px #00000045;
}
.fc-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; border-bottom: 1px solid #ffffff0a; }
.fc-who { display: flex; flex-direction: column; min-width: 0; }
.fc-name { font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.05; }
.fc-sub { font-size: 12.5px; color: var(--muted); }
.fc-where { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; flex-wrap: wrap; font-size: 13.5px; }
.fc-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.fc-log {
  padding: 12px 14px; border-left: 1px dashed #ffffff12; font-size: 12px; line-height: 1.5; max-height: 232px; overflow: hidden;
  display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 2px; min-width: 0;
  mask-image: linear-gradient(0deg, #000 72%, transparent);
}
.fc-log div { color: var(--muted); overflow-wrap: anywhere; }
.fc-log .hero { color: var(--fg); }
.fc-log .win { color: var(--win); }
.fc-log .lose, .fc-log .boss { color: #ff8b78; }
.fc-log .start { color: var(--gold-2); }
.fc-log .warn { color: var(--warn); }
.fc-foot { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-top: 1px solid #ffffff0a; background: #00000026; flex-wrap: wrap; }
.xpline { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12px; color: var(--muted); }
.xpline .lbl { font-weight: 900; color: var(--xp); }
.xpline .grow { min-width: 60px; }
.rates { display: flex; gap: 6px; flex-wrap: wrap; }
.rate { display: flex; flex-direction: column; padding: 3px 10px; border-radius: 8px; background: #ffffff08; line-height: 1.2; }
.rate small { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 900; }
.rate b { font-size: 13.5px; }
@media (max-width: 1150px) {
  .fc-body { grid-template-columns: minmax(0, 1fr); }
  .fc-log { border-left: 0; border-top: 1px dashed #ffffff12; max-height: 104px; }
}

/* Scène : ciel en haut, sol en bas, les combattants posés sur le sol */
.scene {
  position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(88px, 130px) auto minmax(0, 1fr); align-items: end; gap: 10px;
  margin: 12px 0 12px 12px; padding: 16px 14px; min-height: 200px; border-radius: 12px; overflow: hidden; border: 1px solid #00000060;
  background:
    radial-gradient(55% 45% at 75% 15%, #ffffff16, transparent 70%),
    linear-gradient(180deg, color-mix(in srgb, var(--sky) 44%, #0e110b) 0%, color-mix(in srgb, var(--sky) 20%, #0e110b) 58%,
      color-mix(in srgb, var(--ground) 62%, #0e110b) 58.4%, color-mix(in srgb, var(--ground) 30%, #0a0c07) 100%);
  box-shadow: inset 0 0 50px #0009;
}
.scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 42%; z-index: -1; pointer-events: none; background: repeating-linear-gradient(100deg, #ffffff07 0 3px, transparent 3px 15px); }
@media (max-width: 1150px) { .scene { margin: 12px; } }
.unit { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; text-align: center; }
.unit .sprite { position: relative; margin-top: 8px; line-height: 1; }
.unit .sprite::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 76%; height: 9px; transform: translateX(-50%); background: radial-gradient(closest-side, #000b, transparent); z-index: -1; }
.u-name { font-size: 11.5px; font-weight: 800; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000, 0 0 6px #000; }
.u-name small { color: var(--gold-2); font-weight: 900; }
.u-hp { font-size: 10.5px; color: #eee6cf; text-shadow: 0 1px 2px #000; }
.unit .bar { width: 100%; max-width: 112px; height: 6px; }
.unit [data-k="hpb"] { width: 100%; display: flex; justify-content: center; }
.hero .bar { height: 8px; }
.hero.dead { opacity: .45; filter: grayscale(1); }

.scene-empty { align-self: center; color: #eee6ccc0; text-shadow: 0 1px 2px #000; font-size: 13px; text-align: center; font-weight: 700; }

@keyframes shake { 25% { translate: -4px 0; } 50% { translate: 4px 0; } 75% { translate: -2px 0; } }

@media (max-width: 560px) {

}

/* ---------- Recrutement ---------- */

.cls-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 14px 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); transition: border-color .12s, background .12s; }

.recruit-detail { display: flex; gap: 20px; align-items: flex-start; padding: 18px; border-radius: 12px; border: 1px solid #ffffff0a; background: radial-gradient(70% 120% at 0% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), #00000030; }

.passive { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 10px; background: #00000035; border-left: 3px solid var(--c, var(--gold)); }

/* ---------- Héros ---------- */
.hero-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.htab { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); text-align: left; transition: border-color .12s; }
.htab:hover { border-color: var(--line-2); }
.htab > span:not(.emblem):not(.plus) { display: flex; flex-direction: column; line-height: 1.15; }
.htab small { color: var(--muted); font-size: 11.5px; }
.htab[aria-pressed="true"] { border-color: color-mix(in srgb, var(--c, var(--gold)) 75%, var(--gold)); background: color-mix(in srgb, var(--c, var(--gold)) 17%, var(--panel)); }
.htab.add { border-style: dashed; }
.htab.add b { color: var(--gold-2); }
.dot-badge { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; border-radius: 10px; background: var(--gold); color: var(--gold-ink); font-style: normal; font-weight: 900; font-size: 11px; display: grid; place-items: center; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1150px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }

.doll {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 18px 16px 20px; border-radius: 14px; border: 1px solid #ffffff0a;
  background: radial-gradient(60% 70% at 50% 32%, color-mix(in srgb, var(--hc, var(--gold)) 18%, transparent), transparent 72%), #00000030;
}
.doll-col { display: grid; gap: 16px; }
.slot-t {
  position: relative; width: 68px; height: 68px; border-radius: 12px; border: 1.5px solid var(--line-2); padding: 0; display: grid; place-items: center;
  background: linear-gradient(180deg, #2b3223, #1b2016); box-shadow: inset 0 2px 7px #0008; transition: border-color .12s, box-shadow .12s;
}
.slot-t .iart { width: 46px; height: 46px; }
.slot-t .ph { font-size: 22px; opacity: .28; filter: grayscale(1); }
.slot-t .st-l { position: absolute; bottom: 0; left: 50%; transform: translate(-50%, 55%); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; font-weight: 900; background: var(--bg-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; color: var(--dim); white-space: nowrap; }
.slot-t:hover { border-color: var(--gold); }

.portrait { padding: 8px; }
.doll-mid > .display { font-size: 24px; line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.mini-bars { width: 100%; max-width: 230px; display: grid; gap: 6px; margin-top: 4px; }

.relic-mini { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 10px; border: 1px dashed #ffe14d55; background: #ffe14d0a; max-width: 100%; margin-top: 4px; }

.activity { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 2px; }

@media (max-width: 520px) {
  .doll { grid-template-columns: minmax(0, 1fr); }

}
.slot-detail { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--gold); background: #e8aa2e0c; animation: tin .18s ease-out; }

.sdh { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.sdh-btns { display: flex; gap: 6px; }
.detail-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px dashed var(--gold); background: #e8aa2e0a; border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 13px; }
.detail-bar .iart { width: 24px; height: 24px; vertical-align: -7px; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set-block { padding: 8px 10px; border-radius: 9px; background: #00000030; font-size: 12.5px; }
.set-block b { color: var(--gold-2); }
.set-block small { color: var(--muted); }
.set-tiers { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; color: var(--dim); font-size: 12px; }
.set-tiers .on { color: var(--gold-2); font-weight: 800; }
.bag-list { display: flex; flex-direction: column; gap: 6px; }
.bag-r { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 10px 6px 6px; border-radius: 11px; background: #ffffff05; border: 1px solid transparent; }
.bag-r:hover { border-color: var(--line-2); }

.bag-r.q-relic { background: #ffe14d0d; }
.br-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.br-top b { font-size: 13.5px; }
.eqby { color: var(--xp); font-weight: 800; font-size: 11.5px; }
.sd-list { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 3px; }
.sd { font-size: 12px; color: var(--c); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sd i { font-style: normal; font-size: 10.5px; margin-left: 4px; font-weight: 900; }
.sd i.up { color: var(--win); }
.sd i.down { color: #ff8b78; }

.cap { font-size: 12px; font-weight: 900; color: var(--gold-ink); background: var(--gold); padding: 3px 10px; border-radius: 999px; }
.stat-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stat-rows { display: flex; flex-direction: column; }
.srow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #ffffff0a; }
.srow:last-child { border-bottom: 0; }
.srow .dot { width: 10px; height: 10px; border-radius: 3px; transform: rotate(45deg); background: var(--c); }
.sname { font-weight: 800; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.sname small { color: var(--dim); font-weight: 700; font-size: 11.5px; }
.sval { text-align: right; min-width: 64px; display: flex; flex-direction: column; line-height: 1.1; }
.sval b { font-size: 16px; }
.sval small { color: var(--win); font-size: 11px; }
.sbtns { display: flex; gap: 4px; }
.cstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.cstats.two { grid-template-columns: 1fr 1fr; }
.cs { padding: 8px 10px; border-radius: 10px; background: #00000035; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cs small { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 900; }
.cs b { font-size: 16px; }
.spells { display: flex; flex-direction: column; }
.spell { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #ffffff0a; }
.spell:last-child { border-bottom: 0; }
.spell.locked { opacity: .42; }
.pa { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: #fff; background: radial-gradient(circle at 35% 30%, #8ac8f5, #2f78b8); box-shadow: 0 0 0 2px #0008; text-shadow: 0 1px 0 #0008; }
.spell .desc { font-size: 12px; color: var(--muted); }
.elem { font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 5px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); text-transform: uppercase; letter-spacing: .06em; vertical-align: 1px; }

.hslots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 18px 12px 14px; border-radius: 14px; background: radial-gradient(60% 80% at 50% 30%, #93cf5f1a, transparent 70%), #00000030; border: 1px solid #ffffff0a; }
.hslot { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; min-width: 0; }
.hslot small { font-size: 11.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.relic-slot { display: flex; gap: 16px; align-items: center; padding: 14px; border-radius: 14px; border: 1px dashed #ffe14d66; background: radial-gradient(circle at 12% 50%, #ffe14d22, transparent 55%), #00000030; }
.relic-slot.filled { border-style: solid; box-shadow: 0 0 0 1px #ffe14d33 inset, 0 0 26px #ffe14d14; }
.relic-art { width: 72px; height: 72px; flex: none; display: grid; place-items: center; font-size: 40px; }

.rs-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.rs-main .display { color: var(--relic); font-size: 20px; }
.relic-codex { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.relic-entry { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: #00000030; border: 1px solid var(--line); }
.relic-entry.has { border-color: #ffe14d77; }

.relic-mini-ic .iart { width: 36px; height: 36px; }
.re-main b { font-size: 13px; }
.re-src { font-size: 11px; color: var(--relic); opacity: .85; margin-top: 2px; }

/* ---------- Cases d'objets ---------- */
.q-low { --qc: var(--q-low); } .q-mid { --qc: var(--q-mid); } .q-high { --qc: var(--q-high); } .q-stasis { --qc: var(--stasis); } .q-relic { --qc: var(--relic); }
.tile {
  position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; padding: 0; display: grid; place-items: center; border-radius: 11px;
  border: 1.5px solid var(--line-2); background: linear-gradient(180deg, #2b3223, #1b2016); box-shadow: inset 0 2px 7px #0008;
  transition: transform .08s, border-color .12s, box-shadow .12s;
}
button.tile:hover { transform: translateY(-1px); border-color: var(--gold); }
.tile.sel { border-color: var(--gold-2) !important; box-shadow: 0 0 0 3px #e8aa2e66, inset 0 2px 7px #0008; }
.tile[class*="q-"], .slot-t[class*="q-"] { border-color: color-mix(in srgb, var(--qc) 70%, transparent); }
.tile.q-stasis, .slot-t.q-stasis { background: linear-gradient(180deg, #3d2465, var(--stasis-bg)); box-shadow: 0 0 12px #9156e666, inset 0 2px 7px #0008; }
.tile.q-relic, .slot-t.q-relic { background: radial-gradient(circle, #ffe14d26, #1b2016 72%); box-shadow: 0 0 12px #ffe14d40, inset 0 2px 7px #0008; }
.tile .iart { width: 72%; height: 72%; }
.t-emo { font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 1px #0008); }
.t-n { position: absolute; right: 5px; bottom: 2px; font-size: 11.5px; font-weight: 900; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
.t-lv { position: absolute; left: 5px; top: 2px; font-size: 10px; font-weight: 900; color: var(--muted); text-shadow: 0 1px 2px #000; }
.t-by { position: absolute; right: 5px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px #000b; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 8px; }
.tile.sm { width: 48px; height: 48px; border-radius: 9px; }
.tile.md { width: 58px; height: 58px; flex: none; }
.tile.lg { width: 80px; height: 80px; flex: none; }
.tile.res .t-emo { font-size: 26px; }
.tile.lg .t-emo { font-size: 40px; }
.qtag { font-size: 10.5px; font-weight: 900; padding: 2px 7px; border-radius: 5px; background: #00000050; color: var(--qc); white-space: nowrap; border: 1px solid color-mix(in srgb, var(--qc) 35%, transparent); }
.qtag.q-stasis { background: var(--stasis); color: #fff; }
.qtag.q-relic { background: #ffe14d22; }

/* ---------- Inventaire ---------- */
.inv-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.inspector { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); }
@media (max-width: 1050px) { .inv-layout { grid-template-columns: minmax(0, 1fr); } .inspector { position: static; } }
.chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: baseline; }

.inv-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.insp-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 34px 10px; color: var(--muted); }
.insp-empty .ic { width: 42px; height: 42px; color: var(--dim); }
.insp-empty p { margin: 0; }
.insp-head { display: flex; gap: 14px; align-items: center; }

.ih-t small { color: var(--muted); }
.qty { font-size: 16px; font-weight: 900; color: var(--gold-2); }
.insp-stats { display: flex; flex-direction: column; }
.insp-stats .s { display: flex; justify-content: space-between; gap: 10px; color: var(--c); font-weight: 800; font-variant-numeric: tabular-nums; font-size: 13.5px; padding: 4px 0; border-bottom: 1px dotted #ffffff12; }

.insp-sell { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.eqby-line { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 10px; border-radius: 10px; background: #5cc0ad14; }

.uses { display: flex; flex-direction: column; gap: 4px; }
.use { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 10px; border-radius: 8px; background: #ffffff07; border: 1px solid transparent; text-align: left; }

/* ---------- Puces d'envoi ---------- */
.send-list { display: flex; flex-wrap: wrap; gap: 8px; }
.send-chip { position: relative; display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--raise); text-align: left; transition: border-color .12s, background .12s; }
.sc-t { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }

.sc-t small { font-size: 11px; color: var(--muted); max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 1050px) {

  .map-list .ml-h { display: none; }
  .mrow { flex: 0 0 236px; scroll-snap-align: start; }
}
.place-banner {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; min-height: 140px; padding: 18px; border-radius: 12px; border: 1px solid #0007;
  background:

    linear-gradient(180deg, color-mix(in srgb, var(--sky) 48%, #0e110b), color-mix(in srgb, var(--sky) 22%, #0e110b) 58%, color-mix(in srgb, var(--ground) 58%, #0e110b) 58.4%, color-mix(in srgb, var(--ground) 30%, #0a0c07));
  box-shadow: inset 0 0 50px #0008;
}
.pb-txt { min-width: 0; max-width: 62ch; }
.pb-txt .label { color: #f0e7cdcc; text-shadow: 0 1px 2px #000; }

.pb-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.pb-mons { display: flex; gap: 8px; font-size: 32px; filter: drop-shadow(0 3px 2px #000a); }
.pb-mons span { display: inline-block; transform: scaleX(-1); }
.lvl-badge { font-family: var(--f-display); font-size: 16px; color: var(--gold-ink); background: var(--gold); padding: 2px 10px; border-radius: 7px; white-space: nowrap; box-shadow: 0 2px 0 #6e4a07; }
.tiers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tiers button { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--bg-2); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.tiers button b { font-size: 13.5px; }
.tiers button span { font-size: 11.5px; color: var(--muted); }
.tiers button i { font-style: normal; font-size: 11px; color: var(--xp); font-weight: 900; }
.tiers button[aria-pressed="true"] { border-color: var(--gold); background: #e8aa2e17; box-shadow: 0 0 0 1px var(--gold) inset; }
@media (max-width: 900px) { .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .tiers { grid-template-columns: minmax(0, 1fr); } }
.keybox { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; background: #c48a3c18; border: 1px solid #c48a3c44; font-size: 13px; }

.drop-wrap { overflow-x: auto; border: 1px solid #ffffff10; border-radius: 10px; }
.drop-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.drop-table th { text-align: left; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 900; padding: 8px 10px; background: #00000038; white-space: nowrap; }
.drop-table td { padding: 7px 10px; border-top: 1px solid #ffffff0a; vertical-align: middle; }
.dr-row { cursor: pointer; }
.dr-row:hover td { background: #ffffff06; }
.dr-row:focus-visible { outline: 2px solid var(--gold-2); outline-offset: -2px; }
.dr-row.open td { background: #e8aa2e10; }

.dr-items { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
.dr-item { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }

.dr-pc { font-variant-numeric: tabular-nums; color: var(--win); white-space: nowrap; font-size: 12.5px; }
.dr-pc.gold { color: var(--gold-2); }
.dr-pc.stasis { color: var(--stasis-fg); font-size: 11.5px; }

.dr-stasis-line { color: var(--stasis-fg) !important; font-size: 11.5px; }

/* ---------- Ateliers & Récolte ---------- */
.split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
.joblist { display: flex; flex-direction: column; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); }
.jrow { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); text-align: left; transition: border-color .12s, background .12s; }
.jrow:hover { border-color: var(--line-2); }
.jrow[aria-pressed="true"] { border-color: var(--gold); background: linear-gradient(90deg, #e8aa2e1f, var(--panel)); }
.jr-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.jr-top b { font-family: var(--f-display); font-size: 18px; font-weight: 600; }

@media (max-width: 900px) {

}
.tools-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.recipes, .crop-rows { display: flex; flex-direction: column; gap: 8px; }
.rrow { display: grid; grid-template-columns: 58px minmax(0, 1.25fr) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: #ffffff04; }

.rr-main b { font-size: 14.5px; }
.rr-main small { display: block; }
.rr-stats { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 4px; }
.rr-stats span { color: var(--c); font-size: 12px; font-weight: 800; white-space: nowrap; }
.rr-ing { display: flex; flex-wrap: wrap; gap: 5px; }

.ing.ok b { color: var(--win); }

.rr-act { display: flex; flex-direction: column; align-items: stretch; gap: 5px; min-width: 104px; }

}

.crow.locked { opacity: .5; }

.cr-main { min-width: 0; }
.cr-main b { font-size: 15px; }
.cr-main small { display: block; margin-top: 2px; }
.badge-lv { font-size: 10.5px; font-weight: 900; color: var(--gold-ink); background: var(--gold); border-radius: 5px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; }

@media (max-width: 780px) { .crow { grid-template-columns: 58px minmax(0, 1fr); } .cr-send { grid-column: 1 / -1; justify-content: flex-start; } }

/* ---------- Options ---------- */
.opt-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); align-items: start; }

/* ---------- Notifications ---------- */
.toasts {
  position: fixed; z-index: 70; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100vw - 32px));
}

@keyframes tin { from { transform: translateY(10px); opacity: 0; } }
.modal-back { position: fixed; inset: 0; z-index: 80; background: #000000b0; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.away { width: min(480px, 100%); max-height: 90vh; overflow: auto; animation: tin .25s ease-out; }
.away .ing-n { display: inline; color: var(--muted); }
.away-gear { display: flex; flex-wrap: wrap; gap: 6px; }
.craft-pop {
  position: fixed; z-index: 90; pointer-events: none; max-width: min(280px, calc(100vw - 16px)); display: flex; flex-direction: column; gap: 3px; align-items: center; text-align: center;
  background: var(--panel-2); border: 1px solid var(--gold); border-radius: 12px; padding: 9px 13px; font-size: 13px; box-shadow: 0 12px 30px #000b, 0 0 0 3px #e8aa2e22; animation: popup 2.6s ease-out forwards;
}

.craft-pop .pop-stats { font-size: 11.5px; color: var(--muted); }
.craft-pop .pop-stats i { font-style: normal; font-weight: 800; margin: 0 2px; }
.craft-pop .pop-xp { font-size: 11px; color: var(--xp); font-weight: 900; }
@keyframes popup { 0% { opacity: 0; transform: translateY(8px) scale(.9); } 10% { opacity: 1; transform: none; } 75% { opacity: 1; transform: translateY(-6px); } 100% { opacity: 0; transform: translateY(-22px); } }

/* Icônes SVG d'objets (art.js) */
.iart { width: 1.5em; height: 1.5em; display: inline-block; vertical-align: -.42em; filter: drop-shadow(0 1px 0 #0008); flex: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Repas ---------- */
.buff { font-size: 11px; font-weight: 900; padding: 4px 9px; border-radius: 7px; background: #e8aa2e22; color: var(--gold-2); border: 1px solid #e8aa2e55; white-space: nowrap; font-variant-numeric: tabular-nums; }

  border: 1px solid #b9800f; background: linear-gradient(180deg, #f8d77c, #e5a52a); color: var(--gold-ink); box-shadow: 0 2px 0 #6e4a07, 0 10px 24px #000a;
}

  position: fixed; z-index: 56; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px));

  background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 20px 50px #000c; overflow: hidden; animation: tin .2s ease-out;
}

@media (max-width: 900px) {

/* Bandeau « nouvelle version » (commun aux deux interfaces) */
.update-band {
  position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px));
  width: min(560px, calc(100vw - 24px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between;
  padding: 10px 12px 10px 16px; border-radius: 14px; background: #2b2410; color: #f6e7bd; border: 1px solid #e8aa2e; box-shadow: 0 12px 30px #000c;
  font: 600 13.5px/1.35 'Nunito', 'Segoe UI', system-ui, sans-serif; animation: bandin .3s ease-out;
}

/* ---------------------------- Courbes ---------------------------- */
function xpToNext(lvl) { return 2 * Math.floor((16 * Math.pow(lvl, 2.25) + 20 * lvl) * (1 + Math.pow(lvl / 35, 2))); }
function jobXpToNext(lvl) { return Math.floor(40 * Math.pow(lvl, 1.7)); }

const _monCache = {};
function monsterStats(mid) {
  if (_monCache[mid]) return _monCache[mid];
  const m = MONSTERS[mid]; const l = m.lvl;
  const hp = Math.round((12 + l * 8 + l * l * 0.12) * (m.hpm || 1));
  const avg = (2.5 + l * 0.8 + l * l * 0.003) * (m.dm || 1);
  const xp = Math.round((10 + l * 6 + l * l * 1.9) * (m.hpm || 1) * (m.boss ? 1.5 : 1));
  const kamas = [Math.round(l * 1.5 + 2), Math.round(l * 3 + 6)].map(k => m.boss ? k * 8 : k);
  return (_monCache[mid] = { hp, dmin: Math.max(1, Math.round(avg * 0.8)), dmax: Math.round(avg * 1.2), xp, kamas, res: m.res || 0 });
}

function newHero(st, name, cls) {
  const h = {
    id: uid(), name, cls, lvl: 1, xp: 0, capital: 0, auto: CLASSES[cls].main,
    base: { vit: 0, sag: 0, for: 0, int: 0, cha: 0, agi: 0 },
    equip: {}, hp: 0, act: null, fight: null, wait: 0, restTotal: 0, resting: false,
    log: [], session: null,
  };
  h.hp = heroTotals(st, h).maxHp;
  return h;
}

function maxHeroLevel(s) { return s.heroes.reduce((m, h) => Math.max(m, h.lvl), 0); }
function maxSetCount(s) {
  let best = 0;
  for (const h of s.heroes) for (const c of Object.values(setCounts(s, h))) best = Math.max(best, c);
  return best;
}
function gearById(st, id) { return st.gear.find(g => g.uid === id); }
function setCounts(st, h) {
  const c = {};
  for (const slot of SLOTS) {
    const g = h.equip[slot] && gearById(st, h.equip[slot]);

  return c;
}
function setBonus(setId, count) {
  const b = SETS[setId].bonus; let best = null;
  for (const k of Object.keys(b)) if (count >= +k) best = b[k];
  return best || {};
}

/* Statistiques totales d'un héros (base + équipement + panoplies + passif) */
function heroTotals(st, h) {
  const t = { vit: 0, sag: 0, for: 0, int: 0, cha: 0, agi: 0, pui: 0, res: 0, pp: 0, crit: 0, soin: 0, dmg: 0, pa: 0, kamas: 0 };
  for (const s of STATS) t[s] += h.base[s];
  for (const slot of SLOTS) {
    const g = h.equip[slot] && gearById(st, h.equip[slot]);
    if (g) for (const [k, v] of Object.entries(g.stats)) t[k] = (t[k] || 0) + v;
  }
  for (const [set, n] of Object.entries(setCounts(st, h))) for (const [k, v] of Object.entries(setBonus(set, n))) t[k] += v;
  if (h.food && h.food.left > 0 && RESOURCES[h.food.id]) { const f = RESOURCES[h.food.id].food; if (f.speed) t.speed = (t.speed || 0) + f.speed; }
  const rel = h.relic && gearById(st, h.relic);
  if (rel) for (const [k, v] of Object.entries(rel.stats)) t[k] = (t[k] || 0) + v;
  const cl = CLASSES[h.cls];
  if (cl.passive && cl.passive.stats) for (const [k, v] of Object.entries(cl.passive.stats)) t[k] = (t[k] || 0) + v;
  t.maxHp = Math.round((50 + h.lvl * 6) * cl.hpMult + t.vit);
  t.pa = 6 + (h.lvl >= 100 ? 1 : 0) + t.pa;
  t.critPct = clamp(3 + t.crit + t.agi / 25, 0, 50);
  t.dodgePct = clamp(t.agi / 12 + (t.dodge || 0), 0, 35);
  t.resPct = clamp(t.res, 0, 50);
  t.ppTotal = 100 + t.pp + Math.floor(t.cha / 5);
  t.xpBonus = t.sag + (t.xpPct || 0);
  return t;
}

function spellsOf(h) { return CLASSES[h.cls].spells; }
function spellUnlocked(h, sp) { return h.lvl >= sp.lvl; }

/* ---------------------------- Activités ---------------------------- */
function findPlace(type, id) { return type === 'dungeon' ? DUNGEONS.find(d => d.id === id) : type === 'harvest' ? CROPS.find(c => c.id === id) : ZONES.find(z => z.id === id); }

function setActivity(st, h, type, id, tier = 0) {
  h.fight = null; h.resting = false; h.wait = 0; h.restTotal = 0;
  h.hp = heroTotals(st, h).maxHp;
  h.act = type ? { type, id, room: 0, tier: type === 'zone' ? clamp(+tier || 0, 0, SUBZONES.length - 1) : 0 } : null;
  h.session = type ? { start: Date.now(), xp: 0, kamas: 0, kills: 0, runs: 0 } : null;
  h.log = [];
  if (type === 'harvest') h.wait = harvestMs(st, h);
}

function pickGroup(zone, h) {
  const r = Math.random();
  const size = r < 0.4 ? 1 : r < 0.78 ? 2 : 3;
  const out = [];
  for (let i = 0; i < size; i++) out.push(zone.monsters[irnd(0, zone.monsters.length - 1)]);
  return out;
}

function tierOf(h) { return SUBZONES[(h.act && h.act.tier) || 0] || SUBZONES[0]; }
function subName(place, act) { return act && act.type === 'zone' ? `${place.name} ${(act.tier || 0) + 1}` : place.name; }

function startFight(st, h, ev) {
  const place = findPlace(h.act.type, h.act.id);
  let group;
  if (h.act.type === 'dungeon') {
    if (h.act.room === 0) {
      if ((st.res[place.key] || 0) <= 0) {
        ev.log(h, `Plus de ${RESOURCES[place.key].name} : ${h.name} quitte le donjon.`, 'warn');
        ev.stopped && ev.stopped(h, 'Plus de clef');
        setActivity(st, h, null);
        return false;
      }
      st.res[place.key]--;
      ev.log(h, `${h.name} entre dans ${place.name} (clef utilisée).`, 'info');
    }
    group = h.act.room < place.rooms.length ? place.rooms[h.act.room] : place.boss;
  } else {
    group = pickGroup(place, h);
  }
  h.fight = {
    mons: group.map(mid => { const ms = monsterStats(mid); const hp = Math.round(ms.hp * tierOf(h).hp); return { mid, hp, max: hp, poison: null }; }),
    tier: h.act.tier || 0, turn: 1, phase: 0, buffs: [], cds: {}, casts: {},
  };
  const names = group.map(m => MONSTERS[m].name);
  ev.log(h, `Combat contre ${names.join(', ')}.`, 'start');
  return true;
}

/* ---------------------------- Combat ---------------------------- */
function buffTotal(f, k) { return f.buffs.reduce((s, b) => s + (b.stats[k] || 0), 0); }

/* Passifs de classe : puissance bonus selon la situation du combat */
function passivePui(h, t, f) {
  if (h.cls === 'iop' && f) return (f.rage || 0) * 12;
  if (h.cls === 'sacrieur') return Math.round(clamp(1 - h.hp / t.maxHp, 0, 1) * 100);
  return 0;
}
function spellPower(h, t, f, sp) {
  const stat = sp.stat ? t[sp.stat] : 0;
  const pui = t.pui + (f ? buffTotal(f, 'pui') : 0) + passivePui(h, t, f);
  const scale = (1 + h.lvl * 0.045) * (1 + (stat + pui) / 100);
  return { scale, avg: ((sp.min + sp.max) / 2) * scale + t.dmg };
}

function rollSpell(h, t, f, sp, monRes) {
  const { scale } = spellPower(h, t, f, sp);
  let v = rnd(sp.min, sp.max) * scale + t.dmg;
  const crit = Math.random() * 100 < t.critPct;
  if (crit) v *= h.cls === 'cra' ? 1.8 : 1.5;
  if (h.cls === 'sram' && f && f.turn === 1 && sp.type !== 'heal') v *= 2;
  if (h.cls === 'eniripsa' && sp.type === 'heal') v *= 1.25;
  if (t.dmgPct && sp.type !== 'heal') v *= 1 + t.dmgPct / 100;
  if (monRes) v *= 1 - monRes / 100;
  return { v: Math.max(1, Math.round(v)), crit };
}

function heroTurn(st, h, t, ev) {
  const f = h.fight;
  for (const k of Object.keys(f.cds)) if (f.cds[k] > 0) f.cds[k]--;
  let pre = '';
  if (t.regen && h.hp < t.maxHp) { const r = Math.min(t.maxHp - h.hp, Math.round(t.maxHp * t.regen / 100)); h.hp += r; pre += `Relique +${r} PV · `; }
  if (h.cls === 'eniripsa' && h.hp < t.maxHp) { const r = Math.min(t.maxHp - h.hp, Math.round(t.maxHp * 0.04)); h.hp += r; pre = `Souffle Vital +${r} PV · `; }
  f.casts = {};
  let pa = t.pa;
  const actions = [];
  for (let guard = 0; guard < 12; guard++) {
    const alive = f.mons.filter(m => m.hp > 0);
    if (!alive.length) break;
    const usable = spellsOf(h).filter(sp => spellUnlocked(h, sp) && sp.pa <= pa && !(f.cds[sp.id] > 0)
      && (sp.max_ == null || (f.casts[sp.id] || 0) < sp.max_));
    if (!usable.length) break;
    const hpRatio = h.hp / t.maxHp;
    const target = alive.reduce((a, b) => (b.hp < a.hp ? b : a));
    let best = null, bestVal = -1;
    for (const sp of usable) {
      const { avg } = spellPower(h, t, f, sp);
      let val = 0;
      if (sp.type === 'dmg') val = Math.min(avg, target.hp * 1.2);
      else if (sp.type === 'aoe') val = alive.reduce((s, m) => s + Math.min(avg, m.hp), 0);
      else if (sp.type === 'poison') val = target.poison ? 0 : Math.min(avg * sp.turns, target.hp) * 0.9;
      else if (sp.type === 'drain') val = Math.min(avg, target.hp) + (hpRatio < 0.8 ? avg * 0.5 : 0);
      else if (sp.type === 'heal') val = hpRatio < 0.55 ? avg * 2.5 : hpRatio < 0.8 ? avg * 0.4 : 0;
      else if (sp.type === 'buff') {
        const already = f.buffs.some(b => b.id === sp.id);
        const totalHp = alive.reduce((s, m) => s + m.hp, 0);
        val = already ? 0 : totalHp > t.pa * 8 ? 9999 : 0;
      }
      val = val / sp.pa;
      if (val > bestVal) { bestVal = val; best = sp; }
    }
    if (!best || bestVal <= 0) break;
    pa -= best.pa;
    f.casts[best.id] = (f.casts[best.id] || 0) + 1;
    if (best.cd) f.cds[best.id] = best.cd + 1;
    actions.push(castSpell(st, h, t, best, target, alive));
  }
  if (h.cls === 'iop' && actions.length && (f.rage || 0) < 5) { f.rage = (f.rage || 0) + 1; actions.push(`Rage ${f.rage}/5`); }
  if (h.cls === 'sram' && f.turn === 1 && actions.length) pre += 'Embuscade ! ';
  ev.log(h, pre + (actions.length ? actions.join(' · ') : `${h.name} passe son tour.`), 'hero');
}

function castSpell(st, h, t, sp, target, alive) {
  const f = h.fight;
  const tag = r => `${r.v}${r.crit ? ' CC' : ''}`;
  if (sp.type === 'buff') {
    f.buffs.push({ id: sp.id, stats: sp.buff, turns: sp.turns });
    return `${sp.name} (${Object.entries(sp.buff).map(([k, v]) => `+${v} ${STAT_SHORT[k]}`).join(', ')})`;
  }
  if (sp.type === 'heal') {
    const r = rollSpell(h, t, f, sp, 0);
    const v = Math.round(r.v * (1 + t.soin / 100)) + t.soin;
    const before = h.hp; h.hp = Math.min(t.maxHp, h.hp + v);
    return `${sp.name} +${h.hp - before} PV`;
  }
  if (sp.type === 'aoe') {
    const parts = alive.map(m => { const r = rollSpell(h, t, f, sp, monsterStats(m.mid).res); m.hp = Math.max(0, m.hp - r.v); return tag(r); });
    return `${sp.name} → ${parts.join('/')}`;
  }
  const r = rollSpell(h, t, f, sp, monsterStats(target.mid).res);
  if (sp.type === 'poison') {
    target.poison = { dmg: r.v, turns: sp.turns };
    return `${sp.name} sur ${MONSTERS[target.mid].name} (${r.v}/tour)`;
  }
  target.hp = Math.max(0, target.hp - r.v);
  let s = `${sp.name} ${tag(r)}`;
  if (sp.type === 'drain') { const heal = Math.round(r.v / 2); h.hp = Math.min(t.maxHp, h.hp + heal); s += ` (+${heal} PV)`; }
  return s;
}

function monsterTurn(st, h, t, m, ev) {
  const def = MONSTERS[m.mid], ms = monsterStats(m.mid);
  const f = h.fight;
  let line = '';
  if (m.poison) {
    m.hp = Math.max(0, m.hp - m.poison.dmg);
    line += `${def.name} subit ${m.poison.dmg} (poison). `;
    if (--m.poison.turns <= 0) m.poison = null;
    if (m.hp <= 0) { ev.log(h, line + `${def.name} succombe.`, 'mon'); return; }
  }
  if (Math.random() * 100 < t.dodgePct) { ev.log(h, line + `${h.name} esquive ${def.name}.`, 'mon'); return; }
  let dmg = rnd(ms.dmin, ms.dmax) * (SUBZONES[f.tier || 0] || SUBZONES[0]).dmg;
  let special = false;
  if (def.boss && f.turn % 3 === 0) { dmg *= 1.8; special = true; }
  const res = clamp(t.resPct + buffTotal(f, 'res'), 0, 60);
  dmg = Math.max(1, Math.round(dmg * (1 - res / 100)));
  h.hp = Math.max(0, h.hp - dmg);
  ev.log(h, line + `${def.name} ${special ? 'déchaîne sa fureur' : 'frappe'} : −${dmg} PV.`, special ? 'boss' : 'mon');
}

/* Avance le combat d'une action. Retourne 'win' | 'lose' | null */
function fightStep(st, h, ev) {
  const f = h.fight, t = heroTotals(st, h);
  if (f.phase === 0) {
    heroTurn(st, h, t, ev);
    f.phase = 1;
  } else {
    // cherche le prochain monstre vivant à jouer
    while (f.phase <= f.mons.length && f.mons[f.phase - 1].hp <= 0) f.phase++;
    if (f.phase <= f.mons.length) { monsterTurn(st, h, t, f.mons[f.phase - 1], ev); f.phase++; }
    if (f.phase > f.mons.length) {
      f.phase = 0; f.turn++;
      f.buffs.forEach(b => b.turns--); f.buffs = f.buffs.filter(b => b.turns > 0);
    }
  }
  if (f.mons.every(m => m.hp <= 0)) return 'win';
  if (h.hp <= 0) return 'lose';
  if (f.turn > MAX_TURNS) return 'lose';
  return null;
}

function addRes(st, id, n) {
  st.res[id] = (st.res[id] || 0) + n;
  st.stats.obtained[id] = (st.stats.obtained[id] || 0) + n;
}

function gainXp(st, h, xp, ev) {
  if (h.lvl >= MAX_LEVEL) return;
  h.xp += xp;
  while (h.lvl < MAX_LEVEL && h.xp >= xpToNext(h.lvl)) {
    h.xp -= xpToNext(h.lvl);
    h.lvl++;
    h.capital += CAPITAL_PER_LEVEL;
    if (h.auto) autoAllocate(h);
    const newSpells = spellsOf(h).filter(sp => sp.lvl === h.lvl);
    ev.levelup && ev.levelup(h, newSpells);
  }
}

function autoAllocate(h) {
  const s = h.auto; const c = STAT_COST[s];
  while (h.capital >= c) { h.base[s]++; h.capital -= c; }
}

function resolveWin(st, h, ev) {
  const t = heroTotals(st, h);
  const f = h.fight;
  const place = findPlace(h.act.type, h.act.id);
  let xp = 0, kamas = 0; const loot = {}; const gearLoot = [];
  for (const m of f.mons) {
    const def = MONSTERS[m.mid], ms = monsterStats(m.mid);
    const gap = h.lvl - def.lvl;
    const pen = gap > 10 ? clamp(1 - (gap - 10) * 0.06, 0.1, 1) : 1;
    xp += ms.xp * pen;
    kamas += irnd(ms.kamas[0], ms.kamas[1]);
    const dbl = h.cls === 'enutrof' && Math.random() < 0.12 ? 2 : 1;
    for (const [rid, ch] of def.drops) if (Math.random() < Math.min(1, ch * t.ppTotal / 100)) loot[rid] = (loot[rid] || 0) + dbl;
    for (const [rid, rc] of (RELIC_DROPS[m.mid] || [])) if (Math.random() < rc * (SUBZONES[f.tier || 0] || SUBZONES[0]).drop * t.ppTotal / 100) {
      const g = rollItem(rid); st.gear.push(g); gearLoot.push(g);
    }
    const gd = GEAR_DROPS[m.mid];
    if (gd && Math.random() < (def.boss ? GEAR_DROP_RATE_BOSS : GEAR_DROP_RATE) * (SUBZONES[f.tier || 0] || SUBZONES[0]).drop * t.ppTotal / 100) {
      const g = rollItem(gd[irnd(0, gd.length - 1)]); st.gear.push(g); gearLoot.push(g);
      st.stats.gearDropped = (st.stats.gearDropped || 0) + 1;
    }
    if (gd) for (const iid of gd) if (Math.random() < STASIS_RATE * (SUBZONES[f.tier || 0] || SUBZONES[0]).drop * t.ppTotal / 100) {
      const g = rollStasis(iid); st.gear.push(g); gearLoot.push(g);
      st.stats.stasisDropped = (st.stats.stasisDropped || 0) + 1;
    }
    st.stats.kills[m.mid] = (st.stats.kills[m.mid] || 0) + 1;
    st.stats.totalKills++;
  }
  const n = f.mons.length;
  xp *= (1 + (n - 1) * 0.15) * (1 + t.xpBonus / 100) * (place.bonusXp || 1);
  kamas = Math.round(kamas * (1 + (t.kamas || 0) / 100));
  xp = Math.round(xp);
  st.kamas += kamas; st.stats.kamasEarned += kamas; st.stats.fights++;
  for (const [rid, c] of Object.entries(loot)) addRes(st, rid, c);
  if (h.session) { h.session.xp += xp; h.session.kamas += kamas; h.session.kills += n; }
  const lootTxt = Object.entries(loot).map(([r, c]) => `${c}× ${RESOURCES[r].name}`).join(', ');
  ev.log(h, `Victoire ! +${fmt(xp)} XP, +${fmt(kamas)} K${lootTxt ? ' · ' + lootTxt : ''}`, 'win');
  for (const g of gearLoot) ev.log(h, `Objet trouvé : ${ITEMS[g.id].name}${g.stasis ? ' (STASIFIÉ)' : ''} !`, 'boss');
  ev.reward && ev.reward(h, xp, kamas, loot, gearLoot);
  gainXp(st, h, xp, ev);
  if (h.act.type === 'dungeon') {
    h.act.room++;
    if (h.act.room > place.rooms.length) {
      h.act.room = 0; h.act.fails = 0;
      if (h.session) h.session.runs++;
      ev.log(h, `${place.name} terminé !`, 'boss');
      ev.dungeonDone && ev.dungeonDone(h, place);
    }
  }
  h.fight = null;
  const t2 = heroTotals(st, h);
  const missing = 1 - h.hp / t2.maxHp;
  h.resting = true;
  h.restTotal = Math.max(400, missing * REGEN_FULL_MS / (1 + (t2.speed || 0) / 100));
  h.wait += h.restTotal;
}

function resolveLose(st, h, ev) {
  st.stats.deaths++;
  ev.log(h, `${h.name} est vaincu et doit se reposer.`, 'lose');
  ev.defeat && ev.defeat(h);
  h.fight = null; h.hp = 0;
  if (h.act.type === 'dungeon') {
    h.act.room = 0;
    h.act.fails = (h.act.fails || 0) + 1;
    if (h.act.fails >= 3) {
      ev.log(h, `${h.name} abandonne le donjon après 3 défaites d'affilée.`, 'warn');
      ev.stopped && ev.stopped(h, '3 défaites de suite en donjon, trop difficile pour l’instant');
      setActivity(st, h, null);
      return;
    }
  }
  h.resting = true; h.restTotal = DEATH_REST_MS; h.wait += DEATH_REST_MS;
}

/* Avance un héros de dt millisecondes. */
/* Quantité récoltée : augmente de 1 tous les 10 niveaux au-dessus du palier */
function cropQty(st, c) { const lv = st.jobs[c.job].lvl; return [1, 1 + Math.floor(Math.max(0, lv - c.lvl) / 10)]; }
function doHarvest(st, h, ev) {
  const c = findPlace('harvest', h.act.id); const job = st.jobs[c.job];
  if (job.lvl < c.lvl) { ev.stopped && ev.stopped(h, `${GATHER_JOBS[c.job].name} niveau ${c.lvl} requis`); setActivity(st, h, null); return; }
  const ht = harvestTotals(st, h);
  const [a, b] = cropQty(st, c); const n = irnd(a, b) + (Math.random() * 100 < ht.rqty ? 1 : 0);
  const gx = Math.max(1, Math.round(c.xp * (1 + ht.rxp / 100)));
  addRes(st, c.id, n);
  job.xp += gx;
  let up = false;
  while (job.lvl < MAX_JOB_LEVEL && job.xp >= jobXpToNext(job.lvl)) { job.xp -= jobXpToNext(job.lvl); job.lvl++; up = true; }
  st.stats.harvested = (st.stats.harvested || 0) + n;
  if (h.session) { h.session.xp += gx; h.session.kills += n; }
  ev.log(h, `${h.name} récolte ${n}× ${c.name} (+${gx} XP ${GATHER_JOBS[c.job].name}).`, 'win');
  if (up) ev.jobup && ev.jobup(c.job, job.lvl);
}

function stepMs(st, h) { const sp = heroTotals(st, h).speed || 0; return STEP_MS / (1 + sp / 100); }

function tickHero(st, h, dt, ev, maxActions = 200000) {
  if (h.food) { h.food.left -= dt; if (h.food.left <= 0) { h.food = null; ev.foodEnd && ev.foodEnd(h); } }
  if (!h.act) { h.hp = heroTotals(st, h).maxHp; return; }
  if (h.act.type === 'harvest') {
    h.hp = heroTotals(st, h).maxHp; h.wait -= dt; let k = 0;
    while (h.wait <= 0 && h.act && k++ < maxActions) { doHarvest(st, h, ev); if (h.act) h.wait += harvestMs(st, h); }
    return;
  }
  h.wait -= dt;
  let n = 0;
  while (h.wait <= 0 && h.act && n++ < maxActions) {
    if (h.resting || !h.fight) {
      h.resting = false;
      h.hp = heroTotals(st, h).maxHp;
      if (!startFight(st, h, ev)) return;
      h.wait += stepMs(st, h);
      continue;
    }
    const r = fightStep(st, h, ev);
    if (r === 'win') resolveWin(st, h, ev);
    else if (r === 'lose') resolveLose(st, h, ev);
    else h.wait += stepMs(st, h);
  }
  if (n >= maxActions) h.wait = 0;
}

/* Valeur de PV affichée pendant le repos (régénération progressive) */
function displayHp(st, h) {
  const t = heroTotals(st, h);
  if (h.resting && h.restTotal > 0) {
    const p = clamp(1 - h.wait / h.restTotal, 0, 1);
    return Math.round(h.hp + (t.maxHp - h.hp) * p);
  }
  return h.hp;
}

/* ---------------------------- Hors-ligne ---------------------------- */
function simulateOffline(st, ms) {
  ms = Math.min(ms, OFFLINE_CAP_MS);
  const sum = { ms, xp: 0, kamas: 0, kills: 0, loot: {}, levels: {}, deaths: 0, runs: 0, harvest: {}, gear: [] };
  if (ms < 5000) return sum;
  const startLv = Object.fromEntries(st.heroes.map(h => [h.id, h.lvl]));
  const ev = {
    log() {},
    reward(h, xp, k, loot, gear = []) { sum.gear.push(...gear); sum.xp += xp; sum.kamas += k; sum.kills += h.fight.mons.length; for (const [r, c] of Object.entries(loot)) sum.loot[r] = (sum.loot[r] || 0) + c; },
    defeat() { sum.deaths++; },
    dungeonDone() { sum.runs++; },
  };
  const res0 = { ...st.res }; const jobs0 = Object.fromEntries(Object.entries(st.jobs).map(([k, j]) => [k, j.lvl]));
  for (const h of st.heroes) tickHero(st, h, ms, ev, 1e6);
  for (const c of CROPS) { const d = (st.res[c.id] || 0) - (res0[c.id] || 0) - (sum.loot[c.id] || 0); if (d > 0) sum.harvest[c.id] = d; }
  sum.jobs = Object.entries(st.jobs).filter(([k, j]) => j.lvl > jobs0[k]).map(([k, j]) => [k, jobs0[k], j.lvl]);

function allocate(h, stat, n) {

function itemValue(g) { const d = ITEMS[g.id]; return Math.round((20 + d.lvl * d.lvl * 1.5) * (0.6 + itemQuality(g) * 0.8) * (g.stasis ? 10 : 1)); }

  const g = gearById(st, gearUid); if (!g) return 'Objet introuvable.';
  const def = ITEMS[g.id];
  if (def.relic) {
    if (h.lvl < def.lvl) return `Niveau ${def.lvl} requis.`;
    const other = equippedBy(st, gearUid); if (other) unequipUid(other, gearUid);
    h.relic = gearUid; return null;
  }
  if (def.harvest) {
    if (st.jobs.paysan.lvl < def.lvl) return `Paysan niveau ${def.lvl} requis.`;
    const other = equippedBy(st, gearUid); if (other) unequipUid(other, gearUid);

  if (h.lvl < def.lvl) return `Niveau ${def.lvl} requis.`;
  const other = equippedBy(st, gearUid); if (other) unequipUid(other, gearUid);

/* ---------------------------- Sauvegarde ---------------------------- */
function serialize(st) {
  const copy = JSON.parse(JSON.stringify(st));
  for (const h of copy.heroes) h.log = h.log.slice(-10);
  return JSON.stringify(copy);
}
function migrate(obj) {
  const base = newState();
  const st = Object.assign(base, obj);
  st.stats = Object.assign(newState().stats, obj.stats || {});
  for (const j of [...Object.keys(JOBS), ...Object.keys(GATHER_JOBS)]) if (!st.jobs[j]) st.jobs[j] = { lvl: 1, xp: 0 };
  for (const h of st.heroes) {
    h.log = h.log || []; h.hequip = h.hequip || {};
    // contenu supprimé entre versions : on nettoie
    if (h.act && !findPlace(h.act.type, h.act.id)) setActivity(st, h, null);
    if (h.fight && h.fight.mons.some(m => !MONSTERS[m.mid])) h.fight = null;
  }
  st.gear = st.gear.filter(g => ITEMS[g.id]);
  for (const k of Object.keys(st.res)) if (!RESOURCES[k]) delete st.res[k];
  st.v = SAVE_VERSION;
  return st;
}
function exportSave(st) { return btoa(unescape(encodeURIComponent(serialize(st)))); }
function importSave(str) { return migrate(JSON.parse(decodeURIComponent(escape(atob(str.trim()))))); }

/* ---------------------------- Format ---------------------------- */
function fmt(n) {
  n = Math.round(n);
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.', ',') + ' M';
  return n.toLocaleString('fr-FR');
}
function fmtDur(ms) {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h) return `${h} h ${String(m).padStart(2, '0')}`;
  if (m) return `${m} min ${String(s % 60).padStart(2, '0')}`;
  return `${s} s`;
}

/* =====================================================================
   AMAKNA IDLE — BANDEAU « NOUVELLE VERSION »
   Le site publie version.json à chaque mise à jour. Si son numéro ne
   correspond plus à celui de la page ouverte, on propose de recharger.
   (Hors du site en ligne, la requête échoue et rien ne s'affiche.)
   ===================================================================== */
(function () {
  let shown = false;
  async function check() {
    if (shown) return;
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const v = await r.json();
      if (v.build && v.build !== BUILD_ID) show();
    } catch (e) {}
  }
  function show() {
    shown = true;
    const el = document.createElement('div');
    el.className = 'update-band';
    el.setAttribute('role', 'status');
    el.innerHTML = '<span><b>Nouvelle version disponible.</b> Recharge la page pour en profiter, ta partie est conservée.</span><button type="button">Recharger la page</button>';
    el.querySelector('button').addEventListener('click', () => {
      try { window.__game && window.__game.st && localStorage.setItem('amakna-idle-save-v1', serialize(window.__game.st)); } catch (e) {}
      location.reload();
    });
    document.body.appendChild(el);
  }
  setTimeout(check, 5000);
  setInterval(check, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
})();

function craftPop(r, made, xp) {
  const { x, y } = ui.click || { x: innerWidth / 2, y: innerHeight / 2 };
  let html;
  if (RESOURCES[r.out]) html = `<b>${RESOURCES[r.out].icon} ${made.length > 1 ? made.length + '× ' : ''}${esc(RESOURCES[r.out].name)}</b>`;
  else {
    const gs = made.map(m => m.gear).filter(Boolean);
    const best = gs.reduce((a, b) => (itemQuality(b) > itemQuality(a) ? b : a));
    const q = Math.round(itemQuality(best) * 100);
    const cls = q > 80 ? 'q-high' : q > 40 ? 'q-mid' : 'q-low';
    html = `<b>${itemIcon(best.id)} ${gs.length > 1 ? gs.length + '× ' : ''}${esc(ITEMS[best.id].name)}</b>
      <span class="pop-q ${cls}">${gs.length > 1 ? 'Meilleur jet' : 'Jet'} ${q} %</span>
      <span class="pop-stats">${Object.entries(best.stats).map(([k, v]) => `<i style="color:${STAT_COLOR[k]}">+${v} ${STAT_SHORT[k]}</i>`).join(' ')}</span>`;
    if (gs.length > 1) html += `<span class="pop-stats">Jets : ${gs.map(g => Math.round(itemQuality(g) * 100) + ' %').join(', ')}</span>`;
  }
  html += `<span class="pop-xp">+${xp} XP</span>`;

  el.style.top = clamp(y - h - 14, 8, innerHeight - h - 8) + 'px';
  setTimeout(() => el.remove(), 2600);
}

  const t = heroTotals(st, h); const hp = displayHp(st, h);
  const place = h.act ? findPlace(h.act.type, h.act.id) : null;
  const [sc, stxt] = heroStatus(h);
  let where = '<span>Aucune activité.</span> <button class="btn small gold" data-act="view" data-v="carte">Choisir une zone</button>';
  if (place) {
    const room = h.act.type === 'dungeon' ? ` · ${h.act.room < place.rooms.length ? `Salle ${h.act.room + 1}/${place.rooms.length + 1}` : 'Salle du boss'}` : '';
    where = `<span>${h.act.type === 'dungeon' ? 'Donjon' : h.act.type === 'harvest' ? 'Récolte' : 'Zone'} :</span><b>${esc(subName(place, h.act))}</b><span>${room}</span>
      <button class="btn small ghost" data-act="stop" data-hero="${h.id}" style="margin-left:auto">Arrêter</button>`;
  }
  const s = h.session; const el = s ? Math.max(1, Date.now() - s.start) : 1; const perH = v => fmt(v / el * 3600000);
  // Champ de bataille horizontal : le héros à gauche, les monstres alignés à droite
  let foes = `<div class="arena-empty">${h.act ? 'Le héros récupère avant le prochain combat…' : 'En attente d’ordres au zaap d’Astrub.'}</div>`;
  if (h.fight) foes = h.fight.mons.map((m, i) => {
    const d = MONSTERS[m.mid];
    return `<div class="mon${m.hp <= 0 ? ' dead' : ''}${d.boss ? ' boss' : ''}" data-mon="${i}">
      <div class="ico" aria-hidden="true">${d.icon}</div><div class="mn" title="${esc(d.name)}">${esc(d.name)}</div>
      ${bar('hp', m.hp, m.max)}<div class="ml num" data-k="mhp">${fmt(m.hp)} / ${fmt(m.max)}</div></div>`;
  }).join('');
  const turn = h.fight ? `Tour ${h.fight.turn}` : '';
  return `<article class="card fight-card" data-hero-card="${h.id}" style="--c:${CLASSES[h.cls].color}">
    <div class="fc-side">
      <div class="fight-head">${emblem(h.cls)}
        <div class="who"><div class="row between"><span class="name">${esc(h.name)}</span><span class="status ${sc}" data-k="status">${stxt}</span></div>
        <div class="sub">${CLASSES[h.cls].name} · <span class="lvl">Niv. ${h.lvl}</span>${h.capital ? ` · <b style="color:var(--gold2)">${h.capital} pts</b>` : ''}</div></div>
      </div>
      <div><div class="bar-label"><span>Expérience</span><span data-k="xpt">${h.lvl >= MAX_LEVEL ? 'Max' : `${fmt(h.xp)} / ${fmt(xpToNext(h.lvl))}`}</span></div><div data-k="xpb">${bar('xp thin', h.xp, xpToNext(h.lvl))}</div></div>
      <div class="where">${where}</div>
      ${s ? `<div class="rates" data-k="rates">
        ${h.act.type === 'harvest' ? `<div class="rate"><span>XP métier / h</span><b>${perH(s.xp)}</b></div>
        <div class="rate"><span>Récolte / h</span><b>${perH(s.kills)}</b></div>
        <div class="rate"><span>Récoltés</span><b>${fmt(s.kills)}</b></div>` : `<div class="rate"><span>XP / h</span><b>${perH(s.xp)}</b></div>
        <div class="rate"><span>Kamas / h</span><b>${perH(s.kamas)}</b></div>
        <div class="rate"><span>${h.act.type === 'dungeon' ? 'Donjons' : 'Vaincus'}</span><b>${fmt(h.act.type === 'dungeon' ? s.runs : s.kills)}</b></div>`}</div>` : ''}
    </div>
    <div class="arena" data-k="arena">
      <div class="fighter${h.hp <= 0 && h.resting ? ' dead' : ''}${h.fight ? ' fighting-glow' : ''}" data-k="fighter">
        ${emblem(h.cls, 'big')}
        <div class="mn">${esc(h.name)}</div>
        <div data-k="hpb">${bar('hp', hp, t.maxHp)}</div><div class="ml num" data-k="hpt">${fmt(hp)} / ${fmt(t.maxHp)}</div>
      </div>
      ${h.act && h.act.type === 'harvest' ? (() => { const c = place; const job = st.jobs[c.job]; const [qa, qb] = cropQty(st, c); const p = clamp(1 - h.wait / HARVEST_MS, 0, 1);
        return `<div class="vs"><span class="sickle">⚒</span><small>${GATHER_JOBS[c.job].name} ${job.lvl}</small></div>
        <div class="field"><div class="crops" data-k="crops" style="--g:${p.toFixed(2)}">${Array.from({ length: 5 }, () => `<span>${c.icon}</span>`).join('')}</div>
          <div class="field-info"><b>${c.name}</b> <span class="sub" data-k="stock">· ${qa === qb ? qa : `${qa}–${qb}`} par récolte · stock ${fmt(st.res[c.id] || 0)}</span></div>
          <div data-k="hprog">${bar('job', p, 1)}</div>
          <div class="bar-label" style="margin:0"><span>XP ${GATHER_JOBS[c.job].name}</span><span data-k="jxt">${fmt(job.xp)} / ${fmt(jobXpToNext(job.lvl))}</span></div>
          <div data-k="jxb">${bar('xp thin', job.xp, jobXpToNext(job.lvl))}</div></div>`; })()
      : `<div class="vs"><span>VS</span><small data-k="turn">${turn}</small></div>
      <div class="foes">${foes}</div>`}
    </div>
    <div class="log" data-k="log">${logHtml(h)}</div>
  </article>`;
}
function logHtml(h) { return h.log.slice(-8).reverse().map(l => `<div class="${l.c || ''}">${esc(l.t)}</div>`).join(''); }

/* Mise à jour en place des cartes de combat (pas de reconstruction du DOM) */
function patchCombat() {
  for (const h of st.heroes) {
    const card = document.querySelector(`[data-hero-card="${h.id}"]`); if (!card) continue;
    const t = heroTotals(st, h); const hp = displayHp(st, h);
    const q = k => card.querySelector(`[data-k="${k}"]`);
    const [sc, stxt] = heroStatus(h);
    const s1 = q('status'); s1.className = 'status ' + sc; s1.textContent = stxt;
    q('hpt').textContent = `${fmt(hp)} / ${fmt(t.maxHp)}`; q('hpb').innerHTML = bar('hp', hp, t.maxHp);
    q('xpt').textContent = h.lvl >= MAX_LEVEL ? 'Max' : `${fmt(h.xp)} / ${fmt(xpToNext(h.lvl))}`; q('xpb').innerHTML = bar('xp thin', h.xp, xpToNext(h.lvl));
    if (h.fight) h.fight.mons.forEach((m, i) => {
      const el = card.querySelector(`[data-mon="${i}"]`); if (!el) return;
      el.classList.toggle('dead', m.hp <= 0);
      el.querySelector('.bar > i').style.width = clamp(m.hp / m.max * 100, 0, 100).toFixed(1) + '%';
      el.querySelector('[data-k="mhp"]').textContent = `${fmt(m.hp)} / ${fmt(m.max)}`;
    });
    q('log').innerHTML = logHtml(h);
    if (h.act && h.act.type === 'harvest') {
      const c = findPlace('harvest', h.act.id); const job = st.jobs[c.job]; const p = clamp(1 - h.wait / HARVEST_MS, 0, 1);
      const hp2 = q('hprog'); if (hp2) hp2.innerHTML = bar('job', p, 1);
      const cr = q('crops'); if (cr) cr.style.setProperty('--g', p.toFixed(2));
      const sk = q('stock'); if (sk) { const [qa, qb] = cropQty(st, c); sk.textContent = `· ${qa === qb ? qa : `${qa}–${qb}`} par récolte · stock ${fmt(st.res[c.id] || 0)}`; }
      const jx = q('jxt'); if (jx) jx.textContent = `${fmt(job.xp)} / ${fmt(jobXpToNext(job.lvl))}`;
      const jb = q('jxb'); if (jb) jb.innerHTML = bar('xp thin', job.xp, jobXpToNext(job.lvl));
      const r = q('rates'); if (r && h.session) { const el = Math.max(1, Date.now() - h.session.start); const b = r.querySelectorAll('b');
        b[0].textContent = fmt(h.session.xp / el * 3600000); b[1].textContent = fmt(h.session.kills / el * 3600000); b[2].textContent = fmt(h.session.kills); }
      continue;
    }
    const tn = q('turn'); if (tn) tn.textContent = h.fight ? `Tour ${h.fight.turn}` : '';
    const fg = q('fighter'); if (fg) { fg.classList.toggle('dead', h.hp <= 0 && h.resting); fg.classList.toggle('fighting-glow', !!h.fight); }
    const r = q('rates'); if (r && h.session) {
      const el = Math.max(1, Date.now() - h.session.start); const b = r.querySelectorAll('b');
      b[0].textContent = fmt(h.session.xp / el * 3600000); b[1].textContent = fmt(h.session.kamas / el * 3600000);
      b[2].textContent = fmt(h.act.type === 'dungeon' ? h.session.runs : h.session.kills);
    }
  }
}

/* ---------------------------- Vue : Recrutement ---------------------------- */

  const statRows = STATS.map(s => {
    const bonus = t[s] - h.base[s];

      <div class="stat-val">${h.base[s]}${bonus ? ` <small>+${bonus}</small>` : ''}</div>

  }).join('');
  const sets = Object.entries(setCounts(st, h)).map(([id, n]) => {

    return `<div class="sub"><b style="color:var(--gold2)">${SETS[id].name}</b> (${n} pièces)${Object.keys(b).length ? ' : ' + Object.entries(b).map(([k, v]) => `+${v} ${STAT_SHORT[k]}`).join(', ') : ''}</div>`;

  if (!SLOTS.includes(ui.slot)) ui.slot = null;

    .filter(g => { const by = equippedBy(st, g.uid); return !(by && by.id === h.id); })
    .sort((a, b) => ITEMS[b.id].lvl - ITEMS[a.id].lvl || itemQuality(b) - itemQuality(a));
  const curG = ui.slot && h.equip[ui.slot] && gearById(st, h.equip[ui.slot]);
  const spells = spellsOf(h).map(sp => {
    const p = sp.type === 'buff' ? null : spellPower(h, t, null, sp);

      : `${sp.type === 'heal' ? 'Soigne' : 'Inflige'} ~${fmt(p.avg)}${sp.type === 'aoe' ? ' à tous les ennemis' : sp.type === 'poison' ? ` par tour pendant ${sp.turns} tours` : sp.type === 'drain' ? ' et vole la moitié en PV' : ''}`;
    const lim = [sp.cd ? `recharge ${sp.cd} t` : '', sp.max_ ? `${sp.max_}×/tour` : ''].filter(Boolean).join(' · ');
    return `<div class="spell${h.lvl < sp.lvl ? ' locked' : ''}"><span class="pa" title="Points d'action">${sp.pa}</span>
      <div><b>${sp.name}</b> <span class="sub">${h.lvl < sp.lvl ? `· niveau ${sp.lvl}` : sp.stat ? `· ${STAT_ELEM[sp.stat] || ''}` : ''}</span><div class="desc">${eff}${lim ? ' · ' + lim : ''}</div></div><span></span></div>`;

      <div><div class="bar-label"><span>Expérience</span><span>${h.lvl >= MAX_LEVEL ? 'Max' : `${fmt(h.xp)} / ${fmt(xpToNext(h.lvl))}`}</span></div>${bar('xp', h.xp, xpToNext(h.lvl))}</div>
      <div class="passive" style="--c:${CLASSES[h.cls].color}"><span class="label">Passif</span><b>${CLASSES[h.cls].passive.name}</b><span>${CLASSES[h.cls].passive.desc}</span></div>
      <div class="where">${h.act ? `En activité : <b>${esc(placeName(h.act))}</b> <button class="btn small ghost" data-act="stop" data-hero="${h.id}">Arrêter</button>` : 'Inactif.'} <button class="btn small" data-act="view" data-v="carte">Carte</button></div>
      <div class="row between wrap"><span class="label">Caractéristiques · ${h.capital} points</span>

        <button class="btn small ghost" data-act="resetstats">Réinitialiser</button></span></div>
