<meta charset="utf-8">
<title>Amakna Idle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta id="vp" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11140e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style id="css-new">
/* =====================================================================
   AMAKNA IDLE — INTERFACE v2
   Layout : barre latérale (marque, navigation, groupe) + contenu ;
   sur mobile, barre de navigation fixe en bas.
   Monde : sous-bois sombre d'Amakna, or des kamas, ciel des zones.
   ===================================================================== */
:root {
  --bg: #11140e; --bg-2: #171b13; --panel: #1d2218; --panel-2: #242a1e; --raise: #2d3426;
  --line: #333b2a; --line-2: #48523b;
  --fg: #f1ead6; --muted: #aaa38a; --dim: #78765f;
  --gold: #e8aa2e; --gold-2: #f6cd6a; --gold-ink: #2a1c04;
  --hp: #e0533f; --xp: #5cc0ad; --win: #93cf5f; --warn: #e6a93c;
  --terre: #c58f55; --feu: #e8653f; --eau: #55a8ea; --air: #74c552; --sag: #b48ae3; --vit: #eccb52;
  --stasis: #9156e6; --stasis-bg: #261640; --stasis-fg: #dcc0ff; --relic: #ffe14d;
  --q-low: #8f8c78; --q-mid: #ddd5bd; --q-high: #f6cd6a;
  --f-display: 'Grenze', 'Palatino Linotype', Georgia, serif;
  --f-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --r: 14px; --side: 244px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--f-body); font-size: 14px; line-height: 1.45; min-height: 100%;
  background:
    radial-gradient(1200px 700px at 85% -10%, #e8aa2e12, transparent 60%),
    radial-gradient(900px 600px at -10% 110%, #5cc0ad0d, transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--f-display); font-weight: 600; letter-spacing: .2px; }
.sub { color: var(--muted); font-size: 12.5px; }
.hint { color: var(--dim); font-size: 12px; margin: 0; }
.dim { color: var(--dim); }
.lvl { color: var(--gold-2); font-weight: 800; }
.label { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 800; }
.grow { flex: 1; }
.ic { width: 20px; height: 20px; flex: none; }

/* ---------- Coquille ---------- */
#app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  padding-block: 18px 16px; padding-right: 12px; padding-left: max(12px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, #1a1f15, #12160f); border-right: 1px solid var(--line);
  scrollbar-width: thin;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 0; }
.egg { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 3px 4px #0009); }
.brand b { display: block; font-size: 28px; line-height: .9; color: var(--gold-2); text-shadow: 0 2px 0 #0009; }
.brand small { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-weight: 800; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-btn {
  position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
  border: 0; background: none; color: var(--muted); font-weight: 800; font-size: 14px; text-align: left;
  transition: background .12s, color .12s;
}
.nav-btn:hover { background: #ffffff08; color: var(--fg); }
.nav-btn[aria-current="true"] { background: linear-gradient(90deg, #e8aa2e2a, #e8aa2e06); color: var(--gold-2); }
.nav-btn[aria-current="true"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--gold); }

.party { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.party-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 2px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 800; }
.pm {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 8px; border-radius: 10px; border: 1px solid transparent; background: #ffffff05; text-align: left;
}
.pm:hover { border-color: var(--line-2); }
.pm.on { border-color: color-mix(in srgb, var(--c) 60%, transparent); background: color-mix(in srgb, var(--c) 13%, transparent); }
.pm-t { min-width: 0; display: flex; flex-direction: column; }
.pm-t b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-pts { font-style: normal; display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-size: 11px; font-weight: 900; vertical-align: 1px; }
.pst { font-size: 11px; color: var(--muted); display: flex; gap: 5px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pst::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: none; }
.pst.fighting::before { background: var(--hp); box-shadow: 0 0 6px var(--hp); }
.pst.resting::before { background: var(--xp); }
.pst.harvest::before { background: var(--win); }
.pm-hp { display: block; height: 3px; background: #0007; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.pm-hp i { display: block; height: 100%; background: var(--hp); transition: width .2s linear; }
.pm .lvl { font-size: 12px; }
.pm.add { grid-template-columns: 30px minmax(0, 1fr); border-style: dashed; border-color: var(--line-2); background: none; }
.plus { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 1px dashed var(--gold); color: var(--gold-2); font-weight: 900; }
.pm.add b { color: var(--gold-2); }
.pm.add small { font-size: 11px; color: var(--muted); }

.page { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 16px;
  padding-block: 14px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.tb-brand { display: none; }
.tb-brand .egg { width: 30px; height: 30px; }
.tb-title { flex: 1; min-width: 0; }
.tb-title h1 { margin: 0; font-size: 28px; line-height: 1; }
.tb-title p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
.wallet { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.wchip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.wchip small { color: var(--muted); font-size: 11.5px; font-weight: 700; }
.wchip.gold { border-color: #e8aa2e66; background: linear-gradient(180deg, #332c16, #231f11); }
.wchip.gold b { color: var(--gold-2); font-size: 14px; }
.kama {
  width: 15px; height: 15px; border-radius: 50%; display: inline-block; flex: none;
  background: radial-gradient(circle at 35% 35%, var(--gold-2), var(--gold) 55%, #9c6a10);
  box-shadow: inset 0 0 0 1.5px #7a5208;
}
.kamas { display: inline-flex; align-items: center; gap: 5px; }
main { width: 100%; max-width: 1440px; padding-block: 22px 40px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.foot { color: var(--dim); font-size: 11.5px; text-align: center; padding-block: 0 28px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 90ch; margin: 0 auto; }

.bottom-nav {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  background: #151911f2; backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
}
.bottom-nav .nav-btn { flex-direction: column; gap: 3px; padding: 6px 2px; font-size: 10.5px; justify-content: center; text-align: center; border-radius: 8px; min-width: 0; }
.bottom-nav .nav-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bottom-nav .nav-btn[aria-current="true"]::before { left: 28%; right: 28%; top: -7px; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .bottom-nav { display: grid; }
  .tb-brand { display: flex; }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; padding-block: 10px; }
  .tb-title h1 { font-size: 22px; }
  .tb-title p { display: none; }
  .hide-sm { display: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); padding-top: 16px; }
  .foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- Boutons & contrôles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  border: 1px solid var(--line-2); background: var(--raise); color: var(--fg);
  padding: 8px 14px; border-radius: 9px; font-weight: 800; font-size: 13px;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, #f8d77c, #e5a52a); color: var(--gold-ink); border-color: #b9800f; box-shadow: 0 1px 0 #fff6 inset, 0 2px 0 #6e4a07; }
.btn.gold:hover:not(:disabled) { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: #8a3a2e; color: #f6b0a2; background: #34170f; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
.btn.lg { padding: 11px 22px; font-size: 15px; border-radius: 11px; }
.link { background: none; border: 0; padding: 0; color: var(--gold-2); font-weight: 800; text-decoration: underline dotted; text-underline-offset: 2px; }
select, input[type="text"], textarea { background: var(--bg-2); color: var(--fg); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; font: inherit; max-width: 100%; }
textarea { width: 100%; min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; resize: vertical; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; border-radius: 11px; background: #00000045; border: 1px solid var(--line); align-self: flex-start; }
.seg button { border: 0; background: none; color: var(--muted); padding: 6px 13px; border-radius: 8px; font-weight: 800; font-size: 12.5px; }
.seg button:hover:not(:disabled) { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--gold-2); box-shadow: 0 1px 0 #ffffff12 inset, 0 1px 3px #0006; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.toggle { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--muted); font-weight: 700; font-size: 12.5px; padding: 4px 0; }
.toggle .tg { width: 34px; height: 20px; border-radius: 10px; background: #00000060; border: 1px solid var(--line-2); position: relative; transition: background .15s; }
.toggle .tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle[aria-pressed="true"] { color: var(--fg); }
.toggle[aria-pressed="true"] .tg { background: #93cf5f40; border-color: #93cf5f88; }
.toggle[aria-pressed="true"] .tg::after { transform: translateX(14px); background: var(--win); }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #ffffff0c; border: 1px solid #ffffff0a; }
.chip small { color: var(--dim); }
.tag { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 900; padding: 2px 7px; border-radius: 5px; background: #ffffff12; color: var(--muted); }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
.row-btns.left { justify-content: flex-start; }

/* ---------- Panneaux ---------- */
.panel {
  background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 1px 0 #ffffff08 inset, 0 12px 30px #00000040;
}
.panel h3.display { margin: 0; font-size: 21px; line-height: 1.1; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-h h3 .lvl { font-family: var(--f-body); font-size: 13px; margin-left: 6px; }
.list-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.empty { color: var(--muted); padding: 32px 16px; text-align: center; border: 1px dashed var(--line-2); border-radius: 12px; }
.empty.sm { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; }
.hint-band { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; border: 1px dashed var(--line-2); color: var(--muted); }

/* ---------- Barres ---------- */
.bar { height: 10px; border-radius: 6px; background: #00000060; overflow: hidden; position: relative; border: 1px solid #00000050; }
.bar > i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: 6px; transition: width .2s linear; }
.bar.hp > i { background: linear-gradient(180deg, #f27a63, var(--hp)); }
.bar.xp > i { background: linear-gradient(180deg, #86dccb, var(--xp)); }
.bar.job > i { background: linear-gradient(180deg, var(--gold-2), var(--gold)); }
.bar.thin { height: 6px; }

/* ---------- Emblèmes ---------- */
.emblem {
  --s: 44px; width: var(--s); height: var(--s); flex: none; display: grid; place-items: center; position: relative; border-radius: 50%; color: #fff6dc;
  background:
    radial-gradient(circle at 32% 26%, color-mix(in srgb, var(--c) 45%, white) 0%, transparent 42%),
    radial-gradient(circle at 50% 60%, var(--c) 30%, color-mix(in srgb, var(--c) 45%, black) 100%);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 55%, black), inset 0 0 0 4px color-mix(in srgb, var(--gold-2) 55%, transparent),
    inset 0 -6px 10px #00000055, 0 0 0 1.5px #0008, 0 3px 10px color-mix(in srgb, var(--c) 45%, transparent);
}
.emblem svg { width: 58%; height: 58%; filter: drop-shadow(0 1.5px 0 #0009); overflow: visible; }
.emblem.sm { --s: 30px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 55%, black), inset 0 0 0 3px color-mix(in srgb, var(--gold-2) 50%, transparent), 0 0 0 1px #0008; }
.emblem.big { --s: 60px; }
.emblem.xl { --s: 88px; }
.emblem.xl::after, .hero.active .emblem.big::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--c) 65%, transparent); opacity: .8; }
.hero.active .emblem.big { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 55%, black), inset 0 0 0 4px var(--gold-2), 0 0 0 1.5px #0008, 0 0 22px var(--c); } }

/* ---------- Statuts ---------- */
.status { font-size: 10.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 7px; background: #00000045; color: var(--muted); white-space: nowrap; }
.status.fighting { color: #ff9a87; background: #e0533f22; }
.status.resting { color: var(--xp); background: #5cc0ad1c; }
.status.harvest { color: var(--win); background: #93cf5f1c; }
.status.idle { color: var(--dim); }

/* ---------- Combats ---------- */
.fights { display: flex; flex-direction: column; gap: 18px; }
.fc {
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border-top: 3px solid color-mix(in srgb, var(--c) 75%, var(--line)); box-shadow: 0 12px 30px #00000045;
}
.fc-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; border-bottom: 1px solid #ffffff0a; }
.fc-who { display: flex; flex-direction: column; min-width: 0; }
.fc-name { font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.05; }
.fc-sub { font-size: 12.5px; color: var(--muted); }
.fc-where { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; flex-wrap: wrap; font-size: 13.5px; }
.fc-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.fc-log {
  padding: 12px 14px; border-left: 1px dashed #ffffff12; font-size: 12px; line-height: 1.5; max-height: 232px; overflow: hidden;
  display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 2px; min-width: 0;
  mask-image: linear-gradient(0deg, #000 72%, transparent);
}
.fc-log div { color: var(--muted); overflow-wrap: anywhere; }
.fc-log .hero { color: var(--fg); }
.fc-log .win { color: var(--win); }
.fc-log .lose, .fc-log .boss { color: #ff8b78; }
.fc-log .start { color: var(--gold-2); }
.fc-log .warn { color: var(--warn); }
.fc-foot { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-top: 1px solid #ffffff0a; background: #00000026; flex-wrap: wrap; }
.xpline { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12px; color: var(--muted); }
.xpline .lbl { font-weight: 900; color: var(--xp); }
.xpline .grow { min-width: 60px; }
.rates { display: flex; gap: 6px; flex-wrap: wrap; }
.rate { display: flex; flex-direction: column; padding: 3px 10px; border-radius: 8px; background: #ffffff08; line-height: 1.2; }
.rate small { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 900; }
.rate b { font-size: 13.5px; }
@media (max-width: 1150px) {
  .fc-body { grid-template-columns: minmax(0, 1fr); }
  .fc-log { border-left: 0; border-top: 1px dashed #ffffff12; height: 104px; max-height: 104px; box-sizing: border-box; } /* hauteur fixe : la page ne bouge plus quand les lignes arrivent */
}

/* Scène : ciel en haut, sol en bas, les combattants posés sur le sol */
.scene {
  position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(88px, 130px) auto minmax(0, 1fr); align-items: end; gap: 10px;
  margin: 12px 0 12px 12px; padding: 16px 14px; min-height: 200px; border-radius: 12px; overflow: hidden; border: 1px solid #00000060;
  background:
    radial-gradient(55% 45% at 75% 15%, #ffffff16, transparent 70%),
    linear-gradient(180deg, color-mix(in srgb, var(--sky) 44%, #0e110b) 0%, color-mix(in srgb, var(--sky) 20%, #0e110b) 58%,
      color-mix(in srgb, var(--ground) 62%, #0e110b) 58.4%, color-mix(in srgb, var(--ground) 30%, #0a0c07) 100%);
  box-shadow: inset 0 0 50px #0009;
}
.scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 42%; z-index: -1; pointer-events: none; background: repeating-linear-gradient(100deg, #ffffff07 0 3px, transparent 3px 15px); }
@media (max-width: 1150px) { .scene { margin: 12px; } }
.unit { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; text-align: center; }
.unit .sprite { position: relative; margin-top: 8px; line-height: 1; }
.unit .sprite::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 76%; height: 9px; transform: translateX(-50%); background: radial-gradient(closest-side, #000b, transparent); z-index: -1; }
.u-name { font-size: 11.5px; font-weight: 800; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px #000, 0 0 6px #000; }
.u-name small { color: var(--gold-2); font-weight: 900; }
.u-hp { font-size: 10.5px; color: #eee6cf; text-shadow: 0 1px 2px #000; }
.unit .bar { width: 100%; max-width: 112px; height: 6px; }
.unit [data-k="hpb"] { width: 100%; display: flex; justify-content: center; }
.hero .bar { height: 8px; }
.hero.dead { opacity: .45; filter: grayscale(1); }
.mon .sprite { font-size: 42px; transform: scaleX(-1); filter: drop-shadow(0 3px 2px #0009); transition: transform .3s, opacity .3s; }
.mon.boss .sprite { font-size: 56px; }
.mon.boss .u-name { color: var(--gold-2); }
.mon.dead .sprite { opacity: .25; transform: scaleX(-1) rotate(80deg) scale(.8); filter: grayscale(1); }
.mon.dead .u-name, .mon.dead .bar, .mon.dead .u-hp { opacity: .35; }
.foes { display: flex; justify-content: space-around; align-items: flex-end; gap: 8px; min-width: 0; }
.foes .mon { flex: 1 1 0; max-width: 132px; }
.vs { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.vs > span:first-child { font-family: var(--f-display); font-size: 26px; font-weight: 700; color: var(--gold-2); text-shadow: 0 2px 0 #000a; }
.vs small { font-size: 10.5px; color: #eee6cf; white-space: nowrap; text-shadow: 0 1px 2px #000; font-weight: 800; }
.vs-ic .ic { width: 28px; height: 28px; color: #fff3c8; filter: drop-shadow(0 2px 0 #000a); }
.scene-empty { align-self: center; color: #eee6ccc0; text-shadow: 0 1px 2px #000; font-size: 13px; text-align: center; font-weight: 700; }
.hit .sprite { animation: shake .28s; }
@keyframes shake { 25% { translate: -4px 0; } 50% { translate: 4px 0; } 75% { translate: -2px 0; } }
.fnum { position: absolute; left: 50%; top: 22px; z-index: 3; pointer-events: none; white-space: nowrap; font-weight: 900; font-size: 17px; text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: fnum .95s ease-out forwards; }
.fnum.dmg { color: #ffb8a9; }
.fnum.heal { color: #bff293; }
@keyframes fnum { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -38px) scale(1); } }
.field { align-self: stretch; display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; min-width: 0; }
.crops { display: flex; justify-content: space-around; align-items: flex-end; height: 50px; font-size: 30px; }
.crops span { display: inline-block; transform-origin: bottom center; transform: scale(calc(.35 + var(--g, 0) * .75)); transition: transform .2s linear; filter: drop-shadow(0 2px 1px #0008); }
.field-info, .field-xp { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #eee6cf; text-shadow: 0 1px 2px #000; flex-wrap: wrap; }
.field-info b { color: #fff; }
@media (max-width: 560px) {
  .scene { grid-template-columns: 72px auto minmax(0, 1fr); gap: 6px; padding: 12px 8px; min-height: 178px; }
  .emblem.big { --s: 48px; }
  .mon .sprite { font-size: 32px; }
  .mon.boss .sprite { font-size: 42px; }
  .vs > span:first-child { font-size: 18px; }
  .fc-where { justify-content: flex-start; flex-basis: 100%; order: 3; }
  .fc-name { font-size: 19px; }
}

/* ---------- Recrutement ---------- */
.recruit { gap: 16px; }
.big-title { font-size: 30px; margin: 0; line-height: 1.05; text-wrap: balance; }
.cls-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 136px), 1fr)); }
.cls-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 14px 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); transition: border-color .12s, background .12s; }
.cls-card:hover { border-color: var(--line-2); }
.cls-card b { font-family: var(--f-display); font-size: 20px; font-weight: 600; margin-top: 6px; line-height: 1; }
.cls-card small { color: var(--muted); font-size: 11.5px; }
.cls-elem { font-size: 11px; color: var(--dim); font-weight: 700; }
.cls-card[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--bg-2)); box-shadow: 0 0 0 1px var(--c) inset; }
.recruit-detail { display: flex; gap: 20px; align-items: flex-start; padding: 18px; border-radius: 12px; border: 1px solid #ffffff0a; background: radial-gradient(70% 120% at 0% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), #00000030; }
.rd-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rd-main h3 { font-size: 26px; margin: 0; }
.rd-main h3 small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 700; }
.rd-main p { margin: 0; color: var(--muted); }
.rd-spells { display: flex; flex-wrap: wrap; gap: 6px; }
.recruit-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
@media (max-width: 560px) { .recruit-detail { flex-direction: column; align-items: center; text-align: center; } .big-title { font-size: 25px; } }
.passive { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 10px; background: #00000035; border-left: 3px solid var(--c, var(--gold)); }
.passive .label { color: var(--gold-2); }
.passive span:last-child { font-size: 13px; color: var(--muted); }

/* ---------- Héros ---------- */
.hero-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.htab { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); text-align: left; transition: border-color .12s; }
.htab:hover { border-color: var(--line-2); }
.htab > span:not(.emblem):not(.plus) { display: flex; flex-direction: column; line-height: 1.15; }
.htab small { color: var(--muted); font-size: 11.5px; }
.htab[aria-pressed="true"] { border-color: color-mix(in srgb, var(--c, var(--gold)) 75%, var(--gold)); background: color-mix(in srgb, var(--c, var(--gold)) 17%, var(--panel)); }
.htab.add { border-style: dashed; }
.htab.add b { color: var(--gold-2); }
.dot-badge { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; border-radius: 10px; background: var(--gold); color: var(--gold-ink); font-style: normal; font-weight: 900; font-size: 11px; display: grid; place-items: center; padding: 0 5px; box-shadow: 0 0 0 2px var(--bg); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1150px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }

.doll {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 18px 16px 20px; border-radius: 14px; border: 1px solid #ffffff0a;
  background: radial-gradient(60% 70% at 50% 32%, color-mix(in srgb, var(--hc, var(--gold)) 18%, transparent), transparent 72%), #00000030;
}
.doll-col { display: grid; gap: 16px; }
.slot-t {
  position: relative; width: 68px; height: 68px; border-radius: 12px; border: 1.5px solid var(--line-2); padding: 0; display: grid; place-items: center;
  background: linear-gradient(180deg, #2b3223, #1b2016); box-shadow: inset 0 2px 7px #0008; transition: border-color .12s, box-shadow .12s;
}
.slot-t .iart { width: 46px; height: 46px; }
.slot-t .ph { font-size: 22px; opacity: .28; filter: grayscale(1); }
.slot-t .st-l { position: absolute; bottom: 0; left: 50%; transform: translate(-50%, 55%); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; font-weight: 900; background: var(--bg-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; color: var(--dim); white-space: nowrap; }
.slot-t:hover { border-color: var(--gold); }
.slot-t.empty { border-style: dashed; }
.slot-t.sel { border-color: var(--gold-2); box-shadow: 0 0 0 3px #e8aa2e55, inset 0 2px 7px #0008; }
.slot-t.sel .st-l { color: var(--gold-2); border-color: var(--gold); }
.doll-mid { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-width: 0; padding-top: 4px; }
.portrait { padding: 8px; }
.doll-mid > .display { font-size: 24px; line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doll-mid > small { color: var(--muted); }
.mini-bars { width: 100%; max-width: 230px; display: grid; gap: 6px; margin-top: 4px; }
.mini-bars small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.relic-mini { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 10px; border: 1px dashed #ffe14d55; background: #ffe14d0a; max-width: 100%; margin-top: 4px; }
.relic-mini .iart { width: 30px; height: 30px; }
.relic-mini .ph { font-size: 20px; opacity: .45; width: 30px; }
.relic-mini small { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.relic-mini.on { border-style: solid; border-color: #ffe14d99; }
.relic-mini.on small { color: var(--relic); font-weight: 800; }
.activity { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 2px; }
.activity b { color: var(--fg); }
@media (max-width: 520px) {
  .doll { grid-template-columns: minmax(0, 1fr); }
  .doll-mid { order: -1; }
  .doll-col { grid-template-columns: repeat(4, minmax(0, 1fr)); justify-items: center; gap: 10px; }
  .slot-t { width: 62px; height: 62px; }
}
.slot-detail { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--gold); background: #e8aa2e0c; animation: tin .18s ease-out; }
.slot-detail.q-stasis { border-color: var(--stasis); background: var(--stasis-bg); }
.sdh { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.sdh-t { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.sdh-t .display { font-size: 19px; line-height: 1.1; }
.sdh-t small { color: var(--muted); }
.sdh-btns { display: flex; gap: 6px; }
.detail-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px dashed var(--gold); background: #e8aa2e0a; border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 13px; }
.detail-bar .iart { width: 24px; height: 24px; vertical-align: -7px; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set-block { padding: 8px 10px; border-radius: 9px; background: #00000030; font-size: 12.5px; }
.set-block b { color: var(--gold-2); }
.set-block small { color: var(--muted); }
.set-tiers { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; color: var(--dim); font-size: 12px; }
.set-tiers .on { color: var(--gold-2); font-weight: 800; }
.bag-list { display: flex; flex-direction: column; gap: 6px; }
.bag-r { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 10px 6px 6px; border-radius: 11px; background: #ffffff05; border: 1px solid transparent; }
.bag-r:hover { border-color: var(--line-2); }
.bag-r.q-stasis { background: var(--stasis-bg); }
.bag-r.q-relic { background: #ffe14d0d; }
.br-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.br-top b { font-size: 13.5px; }
.eqby { color: var(--xp); font-weight: 800; font-size: 11.5px; }
.sd-list { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 3px; }
.sd { font-size: 12px; color: var(--c); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sd i { font-style: normal; font-size: 10.5px; margin-left: 4px; font-weight: 900; }
.sd i.up { color: var(--win); }
.sd i.down { color: #ff8b78; }

.cap { font-size: 12px; font-weight: 900; color: var(--gold-ink); background: var(--gold); padding: 3px 10px; border-radius: 999px; }
.stat-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stat-rows { display: flex; flex-direction: column; }
.srow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #ffffff0a; }
.srow:last-child { border-bottom: 0; }
.srow .dot { width: 10px; height: 10px; border-radius: 3px; transform: rotate(45deg); background: var(--c); }
.sname { font-weight: 800; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.sname small { color: var(--dim); font-weight: 700; font-size: 11.5px; }
.sval { text-align: right; min-width: 64px; display: flex; flex-direction: column; line-height: 1.1; }
.sval b { font-size: 16px; }
.sval small { color: var(--win); font-size: 11px; }
.sbtns { display: flex; gap: 4px; }
.cstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.cstats.two { grid-template-columns: 1fr 1fr; }
.cs { padding: 8px 10px; border-radius: 10px; background: #00000035; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cs small { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 900; }
.cs b { font-size: 16px; }
.spells { display: flex; flex-direction: column; }
.spell { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #ffffff0a; }
.spell:last-child { border-bottom: 0; }
.spell.locked { opacity: .42; }
.pa { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: #fff; background: radial-gradient(circle at 35% 30%, #8ac8f5, #2f78b8); box-shadow: 0 0 0 2px #0008; text-shadow: 0 1px 0 #0008; }
.spell .desc { font-size: 12px; color: var(--muted); }
.elem { font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 5px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); text-transform: uppercase; letter-spacing: .06em; vertical-align: 1px; }

.hslots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 18px 12px 14px; border-radius: 14px; background: radial-gradient(60% 80% at 50% 30%, #93cf5f1a, transparent 70%), #00000030; border: 1px solid #ffffff0a; }
.hslot { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; min-width: 0; }
.hslot small { font-size: 11.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.relic-slot { display: flex; gap: 16px; align-items: center; padding: 14px; border-radius: 14px; border: 1px dashed #ffe14d66; background: radial-gradient(circle at 12% 50%, #ffe14d22, transparent 55%), #00000030; }
.relic-slot.filled { border-style: solid; box-shadow: 0 0 0 1px #ffe14d33 inset, 0 0 26px #ffe14d14; }
.relic-art { width: 72px; height: 72px; flex: none; display: grid; place-items: center; font-size: 40px; }
.relic-art .iart { width: 72px; height: 72px; filter: drop-shadow(0 0 10px #ffe14d88); }
.relic-art.empty { opacity: .35; filter: grayscale(1); }
.rs-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.rs-main .display { color: var(--relic); font-size: 20px; }
.relic-codex { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.relic-entry { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: #00000030; border: 1px solid var(--line); }
.relic-entry.has { border-color: #ffe14d77; }
.relic-entry:not(.has) .relic-mini-ic { filter: grayscale(1) brightness(.4); }
.relic-mini-ic .iart { width: 36px; height: 36px; }
.re-main b { font-size: 13px; }
.re-src { font-size: 11px; color: var(--relic); opacity: .85; margin-top: 2px; }

/* ---------- Cases d'objets ---------- */
.q-low { --qc: var(--q-low); } .q-mid { --qc: var(--q-mid); } .q-high { --qc: var(--q-high); } .q-stasis { --qc: var(--stasis); } .q-relic { --qc: var(--relic); }
.tile {
  position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; padding: 0; display: grid; place-items: center; border-radius: 11px;
  border: 1.5px solid var(--line-2); background: linear-gradient(180deg, #2b3223, #1b2016); box-shadow: inset 0 2px 7px #0008;
  transition: transform .08s, border-color .12s, box-shadow .12s;
}
button.tile:hover { transform: translateY(-1px); border-color: var(--gold); }
.tile.sel { border-color: var(--gold-2) !important; box-shadow: 0 0 0 3px #e8aa2e66, inset 0 2px 7px #0008; }
.tile[class*="q-"], .slot-t[class*="q-"] { border-color: color-mix(in srgb, var(--qc) 70%, transparent); }
.tile.q-stasis, .slot-t.q-stasis { background: linear-gradient(180deg, #3d2465, var(--stasis-bg)); box-shadow: 0 0 12px #9156e666, inset 0 2px 7px #0008; }
.tile.q-relic, .slot-t.q-relic { background: radial-gradient(circle, #ffe14d26, #1b2016 72%); box-shadow: 0 0 12px #ffe14d40, inset 0 2px 7px #0008; }
.tile .iart { width: 72%; height: 72%; }
.t-emo { font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 1px #0008); }
.t-n { position: absolute; right: 5px; bottom: 2px; font-size: 11.5px; font-weight: 900; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
.t-lv { position: absolute; left: 5px; top: 2px; font-size: 10px; font-weight: 900; color: var(--muted); text-shadow: 0 1px 2px #000; }
.t-by { position: absolute; right: 5px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px #000b; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 8px; }
.tile.sm { width: 48px; height: 48px; border-radius: 9px; }
.tile.md { width: 58px; height: 58px; flex: none; }
.tile.lg { width: 80px; height: 80px; flex: none; }
.tile.res .t-emo { font-size: 26px; }
.tile.lg .t-emo { font-size: 40px; }
.qtag { font-size: 10.5px; font-weight: 900; padding: 2px 7px; border-radius: 5px; background: #00000050; color: var(--qc); white-space: nowrap; border: 1px solid color-mix(in srgb, var(--qc) 35%, transparent); }
.qtag.q-stasis { background: var(--stasis); color: #fff; }
.qtag.q-relic { background: #ffe14d22; }

/* ---------- Inventaire ---------- */
.inv-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.inspector { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); }
@media (max-width: 1050px) { .inv-layout { grid-template-columns: minmax(0, 1fr); } .inspector { position: static; } }
.chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: baseline; }
.fchip small { color: var(--dim); font-size: 11px; }
.fchip:hover { border-color: var(--line-2); color: var(--fg); }
.fchip[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.fchip[aria-pressed="true"] small { color: #2a1c04aa; }
.inv-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.insp-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 34px 10px; color: var(--muted); }
.insp-empty .ic { width: 42px; height: 42px; color: var(--dim); }
.insp-empty p { margin: 0; }
.insp-head { display: flex; gap: 14px; align-items: center; }
.ih-t { display: flex; flex-direction: column; gap: 4px; min-width: 0; align-items: flex-start; }
.ih-t .display { font-size: 21px; line-height: 1.1; }
.ih-t small { color: var(--muted); }
.qty { font-size: 16px; font-weight: 900; color: var(--gold-2); }
.insp-stats { display: flex; flex-direction: column; }
.insp-stats .s { display: flex; justify-content: space-between; gap: 10px; color: var(--c); font-weight: 800; font-variant-numeric: tabular-nums; font-size: 13.5px; padding: 4px 0; border-bottom: 1px dotted #ffffff12; }
.insp-stats .s small { color: var(--dim); font-weight: 700; }
.insp-sell { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.eqby-line { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 10px; border-radius: 10px; background: #5cc0ad14; }
.eqby-line > span:not(.emblem) { flex: 1; }
.uses { display: flex; flex-direction: column; gap: 4px; }
.use { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 10px; border-radius: 8px; background: #ffffff07; border: 1px solid transparent; text-align: left; }
button.use:hover { border-color: var(--line-2); }
.use > span { flex: 1; min-width: 0; }
.use small { color: var(--dim); white-space: nowrap; }
.use .iart { width: 22px; height: 22px; }

/* ---------- Puces d'envoi ---------- */
.send-list { display: flex; flex-wrap: wrap; gap: 8px; }
.send-chip { position: relative; display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--raise); text-align: left; transition: border-color .12s, background .12s; }
.sc-t { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.sc-t b { font-size: 13px; }
.sc-t small { font-size: 11px; color: var(--muted); max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.send-chip .lvl { font-size: 12px; }

}
.place-banner {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; min-height: 140px; padding: 18px; border-radius: 12px; border: 1px solid #0007;

  box-shadow: inset 0 0 50px #0008;
}
.pb-txt { min-width: 0; max-width: 62ch; }

.lvl-badge { font-family: var(--f-display); font-size: 16px; color: var(--gold-ink); background: var(--gold); padding: 2px 10px; border-radius: 7px; white-space: nowrap; box-shadow: 0 2px 0 #6e4a07; }
.tiers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tiers button { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--bg-2); border-radius: 10px; padding: 8px 12px; min-width: 0; }

@media (max-width: 900px) { .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .tiers { grid-template-columns: minmax(0, 1fr); } }

.drop-table th { text-align: left; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 900; padding: 8px 10px; background: #00000038; white-space: nowrap; }

.dr-row { cursor: pointer; }

.split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }

/* ---------- Options ---------- */

/* ---------- Notifications ---------- */

  position: fixed; z-index: 70; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100vw - 32px));
}

.craft-pop {
  position: fixed; z-index: 90; pointer-events: none; max-width: min(280px, calc(100vw - 16px)); display: flex; flex-direction: column; gap: 3px; align-items: center; text-align: center;

  border: 1px solid #b9800f; background: linear-gradient(180deg, #f8d77c, #e5a52a); color: var(--gold-ink); box-shadow: 0 2px 0 #6e4a07, 0 10px 24px #000a;
}

:root[data-layout="mobile"] .chat-panel { left: 0; right: 0; bottom: 0; width: auto; max-width: 460px; margin-inline: auto; height: min(78vh, 600px); border-radius: 16px 16px 0 0; }
.toasts { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 900px) { .toasts { bottom: calc(136px + env(safe-area-inset-bottom, 0px)); } }

/* Bandeau « nouvelle version » (commun aux deux interfaces) */
.update-band {
  position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px));
  width: min(560px, calc(100vw - 24px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between;
  padding: 10px 12px 10px 16px; border-radius: 14px; background: #2b2410; color: #f6e7bd; border: 1px solid #e8aa2e; box-shadow: 0 12px 30px #000c;
  font: 600 13.5px/1.35 'Nunito', 'Segoe UI', system-ui, sans-serif; animation: bandin .3s ease-out;
}
.update-band b { color: #f6cd6a; }
.update-band span { flex: 1; min-width: 180px; }
.update-band button { border: 1px solid #b9800f; background: linear-gradient(180deg, #f8d77c, #e5a52a); color: #2a1c04; font: 800 13px 'Nunito', system-ui, sans-serif; padding: 8px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
@keyframes bandin { from { opacity: 0; transform: translate(-50%, -10px); } }

/* ---------- Compte ---------- */
.acc-form { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; align-items: center; }
@media (max-width: 420px) { .acc-form { grid-template-columns: minmax(0, 1fr); } }
.acc-on { display: flex; align-items: center; gap: 12px; }
.acc-av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 22px var(--f-display); color: var(--gold-ink); background: radial-gradient(circle at 35% 30%, var(--gold-2), var(--gold) 60%, #9c6a10); box-shadow: 0 0 0 2px #0008; }
.acc-on b { display: block; font-size: 16px; }
.acc-on small { color: var(--muted); }
.acc-err { margin: 0; color: #ff9a87; font-size: 13px; font-weight: 700; }
.acc-ok { margin: 0; color: var(--win); font-size: 13px; font-weight: 700; }
.acc-chip { cursor: pointer; }
.acc-chip b { color: var(--gold-2); }

.av { width: 30px; height: 30px; border-radius: 50%; flex: none; object-fit: cover; box-shadow: 0 0 0 2px #0008; background: var(--raise); }
.av.letter { display: grid; place-items: center; color: #1b1e14; font: 800 14px var(--f-body); }
.av.sm { width: 22px; height: 22px; font-size: 11px; }
.av.xl { width: 64px; height: 64px; font-size: 28px; box-shadow: 0 0 0 2px var(--gold), 0 4px 12px #0008; }
.acc-on { align-items: flex-start; }
label.btn { cursor: pointer; }
.is-busy { opacity: .5; pointer-events: none; }

/* Ruban du site de test */
.dev-ribbon { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; position: fixed; z-index: 99; left: 0; right: 0; top: env(safe-area-inset-top, 0px); padding: 4px max(12px, env(safe-area-inset-right, 0px)) 4px max(12px, env(safe-area-inset-left, 0px)); text-align: center; font: 800 11.5px 'Nunito', system-ui, sans-serif; letter-spacing: .04em; color: #12230a; background: repeating-linear-gradient(135deg, #93cf5f 0 14px, #7bbd47 14px 28px); box-shadow: 0 2px 8px #0008; }
.dev-publish { pointer-events: auto; text-decoration: none; color: #fff; background: #1f3b12; border: 1px solid #0d1a07; border-radius: 6px; padding: 2px 10px; font-weight: 900; white-space: nowrap; }
.dev-publish:hover { background: #2c5419; }
.is-dev body { padding-top: 30px; }
.is-dev .topbar, .is-dev .side { top: calc(30px + env(safe-area-inset-top, 0px)); }
@media (max-width: 520px) { .dev-ribbon > span { display: none; } }

.chat-st:hover, .chat-st[aria-expanded="true"] { border-color: var(--line-2); background: #ffffff08; }
.chat-st.on::after { content: "▾"; font-size: 10px; margin-left: 2px; }
.chat-st[aria-expanded="true"]::after { content: "▴"; }
.chat-players { border-bottom: 1px solid var(--line); background: #00000030; padding: 10px 14px; max-height: 40%; overflow-y: auto; animation: tin .15s ease-out; }
.cp-h { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 900; margin-bottom: 6px; }
.chat-players ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.chat-players li { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13.5px; }
.chat-players li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--win); box-shadow: 0 0 6px var(--win); flex: none; }
.chat-players li small { color: var(--gold-2); font-size: 11px; }
.cp-anon { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; }

/* Xélor : sablier et ennemis figés */
.vs .grains { margin-top: 4px; padding: 1px 7px; border-radius: 999px; background: #3f73c433; border: 1px solid #3f73c477; color: #cfe0ff !important; font-variant-numeric: tabular-nums; }
.vs .grains.full { background: #3f73c4; color: #fff !important; box-shadow: 0 0 10px #6fa0ff; animation: pulse 1.2s ease-in-out infinite; }
.mon.frozen .sprite { filter: drop-shadow(0 0 6px #8fd0ff) saturate(.4) brightness(1.15); }
.mon.frozen .u-name::after { content: " ❄"; color: #9fd8ff; }

/* ---------- Animations des passifs du Xélor ---------- */
.fx { position: absolute; inset: 0; z-index: 4; pointer-events: none; display: grid; place-items: center; }
.fx-ring { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #8fb8ff; box-shadow: 0 0 20px #6fa0ff, inset 0 0 14px #6fa0ff; animation: fxring 1.1s ease-out forwards; }
.fx-ring.r2 { animation-delay: .18s; border-style: dashed; }
.fx-icon { font-size: 46px; filter: drop-shadow(0 0 12px #8fb8ff); animation: fxspin 1.2s cubic-bezier(.5, 0, .3, 1) forwards; }
.fx-text { position: absolute; bottom: 18%; font: 700 26px var(--f-display); color: #e3edff; text-shadow: 0 0 10px #3f73c4, 0 2px 0 #000; letter-spacing: .5px; animation: fxtext 1.4s ease-out forwards; white-space: nowrap; }
@keyframes fxring { from { transform: scale(.3); opacity: 1; } to { transform: scale(5); opacity: 0; } }
@keyframes fxspin { 0% { transform: scale(.2) rotate(0); opacity: 0; } 25% { transform: scale(1.2) rotate(-200deg); opacity: 1; } 70% { transform: scale(1) rotate(-540deg); opacity: 1; } 100% { transform: scale(.6) rotate(-720deg); opacity: 0; } }
@keyframes fxtext { 0% { transform: translateY(14px) scale(.8); opacity: 0; } 20% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
/* Rembobinage : la scène bleuit et « recule » légèrement */
.scene.fx-rewind-on { animation: rewindscene 1.2s ease-in-out; }
@keyframes rewindscene { 0% { filter: none; } 30% { filter: hue-rotate(-40deg) saturate(.5) brightness(1.15) contrast(1.1); transform: translateX(-4px); } 60% { transform: translateX(3px); } 100% { filter: none; transform: none; } }
/* Paradoxe : flash blanc et le héros tourne à l'envers */
.fx-paradox .fx-ring { border-color: #fff; box-shadow: 0 0 30px #fff, inset 0 0 20px #bcd4ff; }
.fx-paradox .fx-text { color: #fff; font-size: 30px; }
.scene.fx-paradox-on { animation: paradoxflash 1.3s ease-out; }
.scene.fx-paradox-on .hero .sprite { animation: paradoxspin 1.1s ease-in-out; }
@keyframes paradoxflash { 0% { box-shadow: inset 0 0 0 999px #ffffffcc; } 100% { box-shadow: inset 0 0 50px #0009; } }
@keyframes paradoxspin { 0% { transform: rotate(0); } 100% { transform: rotate(-720deg); } }
/* Gel : éclats de glace autour du monstre */
.ice { position: absolute; left: 50%; bottom: 22px; z-index: 3; color: #bfe6ff; font-size: 15px; pointer-events: none; text-shadow: 0 0 6px #8fd0ff; animation: icefly .8s ease-out forwards; }
@keyframes icefly { from { transform: translate(-50%, 0) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), var(--dy)) scale(1.1) rotate(160deg); opacity: 0; } }
.freeze-pop .sprite { animation: freezepop .5s ease-out; }
@keyframes freezepop { 0% { transform: scaleX(-1) scale(1); } 35% { transform: scaleX(-1) scale(1.18); filter: brightness(2) drop-shadow(0 0 10px #bfe6ff); } 100% { transform: scaleX(-1) scale(1); } }

.pv-list { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.pv-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; }
.pv-ic { font-size: 17px; line-height: 1.3; text-align: center; }
.pv-list b { display: block; font-size: 13.5px; color: var(--fg); }
.pv-list span:not(.pv-ic) { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.recruit-detail .passive { align-self: stretch; }

/* ---------- Animations des sorts ---------- */
.scene .sfx { position: absolute; z-index: 5; pointer-events: none; will-change: transform, opacity; }
.sfx-ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--c); box-shadow: 0 0 12px var(--c), inset 0 0 8px var(--c); }
.sfx-ring.thick { border-width: 5px; width: 50px; height: 50px; }
.sfx-spark { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.sfx-slash { width: var(--w, 64px); height: 6px; border-radius: 50%; background: linear-gradient(90deg, transparent, #fff 45%, var(--c) 55%, transparent); box-shadow: 0 0 14px var(--c), 0 0 4px #fff; }
.sfx-glyph { font-size: 22px; line-height: 1; filter: drop-shadow(0 0 6px var(--c)) drop-shadow(0 2px 1px #000a); }
.sfx-glyph.big { font-size: 34px; }
.sfx-glyph.small { font-size: 15px; color: var(--c); }
.sfx-arrow { width: 30px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--c)); box-shadow: 0 0 8px var(--c); transform-origin: 50% 50%; }
.sfx-arrow::after { content: ""; position: absolute; right: -6px; top: 50%; transform: translateY(-50%); border: 5px solid transparent; border-left: 8px solid var(--c); }
.sfx-arrow.needle { width: 24px; height: 2px; background: linear-gradient(90deg, transparent, #fff 60%, var(--c)); }
.sfx-arrow.needle::after { border-width: 3px; border-left-width: 6px; right: -5px; }
.sfx-beam { height: 10px; border-radius: 6px; transform-origin: 0 50%; background: linear-gradient(180deg, transparent, var(--c) 30%, #fff 50%, var(--c) 70%, transparent); box-shadow: 0 0 18px var(--c); }
.sfx-beam.dark { background: linear-gradient(180deg, transparent, #1a0033 20%, var(--c) 45%, #e0d0ff 50%, var(--c) 55%, #1a0033 80%, transparent); height: 14px; }
.sfx-boom { font-size: 36px; }
.sfx-wave { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--c); background: radial-gradient(circle, transparent 50%, color-mix(in srgb, var(--c) 30%, transparent)); box-shadow: 0 0 18px var(--c); }
.sfx-spike { width: 10px; height: 34px; background: linear-gradient(180deg, #fff, var(--c)); clip-path: polygon(50% 0, 100% 100%, 0 100%); transform-origin: 50% 100%; filter: drop-shadow(0 0 6px var(--c)); }
.sfx-bubble { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 35%, transparent); }
.sfx-aura { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 60%, transparent), transparent 70%); }
.sfx-orb { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--c)); box-shadow: 0 0 10px var(--c); }

/* Sac : types d'objets et exemplaires regroupés */
.type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.type-btn { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--raise); text-align: left; }
.type-btn:hover:not(:disabled) { border-color: var(--gold); }
.type-btn.none { opacity: .4; }
.tb-ic { font-size: 22px; }
.tb-t { display: flex; flex-direction: column; line-height: 1.2; }
.tb-t small { color: var(--muted); font-size: 11.5px; }
.tb-up { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--win); color: #12230a; font-style: normal; font-size: 11px; font-weight: 900; box-shadow: 0 0 0 2px var(--bg); }
.bag-group { display: flex; flex-direction: column; gap: 4px; }
.bg-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 0 6px 2px 66px; font-size: 12.5px; }

.bag-r.sub-r { padding-top: 4px; padding-bottom: 4px; }

/* ===================== Colère de Iop ===================== */
.fury { position: relative; width: 100%; max-width: 112px; height: 12px; margin-top: 2px; border-radius: 7px; background: #1a0804cc; border: 1px solid #00000080; overflow: hidden; box-shadow: inset 0 1px 3px #000a; }
.fury-fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .4s ease;
  background: linear-gradient(90deg, #7a1204, #d0331a 55%, #ff8a2a 85%, #ffd56a); }
.fury-fill::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, #ffffff22 0 4px, transparent 4px 10px); animation: furyflow 1.2s linear infinite; }
.fury-lbl { position: absolute; inset: 0; display: grid; place-items: center; font-size: 8.5px; font-weight: 800; letter-spacing: .06em; color: #fff3dc; text-shadow: 0 1px 2px #000, 0 0 3px #000; text-transform: uppercase; }
.fury.full { border-color: #ffcf5a; animation: furyfull 1s ease-in-out infinite; }
.fury.full .fury-fill { background: linear-gradient(90deg, #ff3b22, #ffb02e, #fff1a8, #ffb02e, #ff3b22); background-size: 200% 100%; animation: furyshine 1.4s linear infinite; }
@keyframes furyflow { to { background-position: 28px 0; } }
@keyframes furyshine { to { background-position: -200% 0; } }
@keyframes furyfull { 50% { box-shadow: 0 0 10px #ff6a2a, 0 0 2px #fff inset; } }

.fury-btn { position: absolute; left: 50%; bottom: calc(100% + 4px); z-index: 6; width: 42px; height: 42px; margin-left: -21px; padding: 7px; border-radius: 50%; cursor: pointer;
  border: 2px solid #ffe08a; background: radial-gradient(circle at 50% 35%, #ff7a3a, #b4200c 60%, #4a0a02); color: #fff;
  box-shadow: 0 0 0 3px #00000070, 0 0 18px #ff5a1e, 0 0 36px #ff3b1488; animation: furybob 1.1s ease-in-out infinite; }
.fury-btn svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1px 1px #000); }
.fury-btn::before, .fury-btn::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #ffcf5a; animation: furyping 1.4s ease-out infinite; pointer-events: none; }
.fury-btn::after { animation-delay: .7s; }
.fury-btn:hover { filter: brightness(1.15); }
.fury-btn:active { transform: scale(.92); }
.fury-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
@keyframes furybob { 50% { translate: 0 -5px; } }
@keyframes furyping { from { transform: scale(1); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }

.scene.has-fury { padding-top: 58px; }
/* Cinématique */
.colere { position: absolute; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
.cl-dark { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease;
  background: radial-gradient(60% 80% at var(--hx) var(--hy), #ff3b1430, #1a0200d8 70%), linear-gradient(#000a, #2a0500c0); }
.colere.s1 .cl-dark { opacity: 1; }
.colere.s5 .cl-dark { opacity: 0; transition-duration: .45s; }
.cl-aura { position: absolute; left: var(--hx); top: var(--hy); width: 0; height: 0; }
.cl-rune { position: absolute; left: -70px; top: -40px; width: 140px; height: 140px; transform: scaleY(.38) rotate(0); transform-origin: 50% 50%; opacity: 0; fill: none; stroke: #ffb02e; stroke-width: 1.6; filter: drop-shadow(0 0 4px #ff5a1e); translate: 0 32px; }
.cl-rune circle { stroke-dasharray: 6 4; } .cl-rune .r2 { stroke: #ff3b22; stroke-dasharray: 2 5; } .cl-rune .r3 { stroke: #ffe08a; stroke-width: 1; }
.colere.s1 .cl-rune { animation: clrune 1.4s ease-out forwards; }
.colere.s4 .cl-rune { animation: clruneout .5s ease-in forwards; }
@keyframes clrune { from { opacity: 0; transform: scaleY(.38) rotate(0) scale(.3); } 40% { opacity: 1; } to { opacity: 1; transform: scaleY(.38) rotate(240deg) scale(1); } }
@keyframes clruneout { from { opacity: 1; transform: scaleY(.38) rotate(240deg) scale(1); } to { opacity: 0; transform: scaleY(.38) rotate(300deg) scale(1.8); } }
.cl-in { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: #ffd56a; box-shadow: 0 0 8px #ff6a1e, 0 0 2px #fff; opacity: 0; }
.colere.s1 .cl-in { animation: clin .7s ease-in var(--d) 2 both; }
@keyframes clin { from { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); } 30% { opacity: 1; } to { opacity: 0; transform: translate(0, 0) scale(.3); } }

.cl-title { position: absolute; left: 50%; top: 14%; translate: -50% 0; display: flex; flex-direction: column; align-items: center; line-height: .9; opacity: 0; white-space: nowrap;
  font-family: var(--display, Georgia, serif); font-weight: 900; text-transform: uppercase; }
.cl-title span, .cl-title b { background: linear-gradient(180deg, #fffbe0 10%, #ffd04a 45%, #e2521a 75%, #7a1204); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1px #3a0802; filter: drop-shadow(0 3px 0 #2a0500) drop-shadow(0 0 14px #ff4a1a); }
.cl-title span { font-size: clamp(30px, 7vw, 54px); letter-spacing: .08em; }
.cl-title b { font-size: clamp(16px, 3.4vw, 26px); letter-spacing: .5em; margin-right: -.5em; }
.colere.s2 .cl-title { animation: cltitle 1.9s cubic-bezier(.2, 1.4, .4, 1) forwards; }
@keyframes cltitle { 0% { opacity: 0; transform: scale(3.2); filter: blur(6px); } 14% { opacity: 1; transform: scale(.94); filter: blur(0); } 22% { transform: scale(1.04); } 30% { transform: scale(1); } 80% { opacity: 1; transform: scale(1.02); } 100% { opacity: 0; transform: scale(1.12) translateY(-10px); } }

.cl-beam { position: absolute; left: var(--cx); top: 0; bottom: calc(100% - var(--gy)); width: 64px; margin-left: -32px; opacity: 0; transform-origin: top; transform: scaleX(.1);
  background: linear-gradient(90deg, transparent, #ffd56a55 30%, #fffbe8cc 50%, #ffd56a55 70%, transparent); filter: blur(2px); mix-blend-mode: screen; }
.colere.s3 .cl-beam { animation: clbeam .9s ease-out forwards; }
@keyframes clbeam { 0% { opacity: 0; transform: scaleX(.1); } 30% { opacity: 1; transform: scaleX(1); } 60% { opacity: .9; } 100% { opacity: 0; transform: scaleX(2.4); } }

.cl-sword { position: absolute; left: var(--cx); top: var(--gy); width: 70px; height: 232px; margin-left: -35px; translate: 0 -100%; transform: translateY(-140%); opacity: 0; }
.cl-sword-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cl-sword::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 100%; height: 160%; background: linear-gradient(transparent, #fff8d870); filter: blur(5px); opacity: 0; }
.colere.s3 .cl-sword { animation: clsword .45s cubic-bezier(.6, 0, 1, .6) forwards; }
.colere.s3 .cl-sword::after { animation: cltrail .45s linear forwards; }
.colere.s4 .cl-sword { animation: clstuck 1.4s ease-out forwards; }
@keyframes clsword { from { opacity: 1; transform: translateY(-140%) scaleY(1.25); } to { opacity: 1; transform: translateY(14%) scaleY(1); } }
@keyframes cltrail { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: .8; } }
@keyframes clstuck { 0% { opacity: 1; transform: translateY(14%) scale(1.04, .94); } 8% { transform: translateY(12%) scale(1); } 15% { transform: translateY(12%) rotate(-1.5deg); } 22% { transform: translateY(12%) rotate(1deg); } 30% { transform: translateY(12%) rotate(0); filter: drop-shadow(0 0 10px #ffb02e); } 75% { opacity: 1; filter: drop-shadow(0 0 22px #ffd56a) brightness(1.3); } 100% { opacity: 0; transform: translateY(-20%) scale(1.05); filter: drop-shadow(0 0 30px #fff) brightness(2.5); } }

.cl-impact { position: absolute; left: var(--cx); top: var(--gy); width: 0; height: 0; }
.cl-wave { position: absolute; left: -60px; top: -18px; width: 120px; height: 36px; border-radius: 50%; border: 4px solid #ffe08a; box-shadow: 0 0 14px #ff6a1e, inset 0 0 12px #ff6a1e; opacity: 0; }
.cl-wave.w2 { border-color: #ff6a2a; border-width: 3px; } .cl-wave.w3 { border-color: #fff; border-width: 2px; }
.colere.s4 .cl-wave { animation: clwave .8s cubic-bezier(.1, .7, .3, 1) forwards; }
.colere.s4 .cl-wave.w2 { animation-delay: .1s; } .colere.s4 .cl-wave.w3 { animation-delay: .2s; animation-duration: 1s; }
@keyframes clwave { from { opacity: 1; transform: scale(.2); } to { opacity: 0; transform: scale(4.2); } }
.cl-crack { position: absolute; left: -110px; top: -14px; width: 220px; height: 44px; fill: none; stroke: #1a0602; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; filter: drop-shadow(0 0 3px #ff6a1e) drop-shadow(0 0 1px #ffd56a); stroke-dasharray: 160; stroke-dashoffset: 160; }

.hero.jp-pose .hs .sp { animation: jpspill 1.1s cubic-bezier(.2, .7, .4, 1) 1.25s both; }
.hs .sp:nth-child(1) { --dx: -20px; --dy: -30px; } .hs .sp:nth-child(2) { --dx: -8px; --dy: -42px; } .hs .sp:nth-child(3) { --dx: 6px; --dy: -46px; }
.hs .sp:nth-child(4) { --dx: 20px; --dy: -36px; } .hs .sp:nth-child(5) { --dx: -28px; --dy: -12px; } .hs .sp:nth-child(6) { --dx: 30px; --dy: -14px; } .hs .sp:nth-child(7) { --dx: 0px; --dy: -34px; }
@keyframes jpspill { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 12% { opacity: 1; } 55% { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(1) rotate(200deg); } 100% { opacity: 0; transform: translate(calc(var(--dx) * 1.25), calc(var(--dy) + 50px)) scale(.9) rotate(420deg); } }

/* ===================== Iop : cheveux de flammes, cape, grande épée, aura de Rage ===================== */
.hs-iop .p-cape { transform-origin: 90% 10%; animation: ipcape 2.2s ease-in-out infinite; }
.hs-iop .p-tails { transform-origin: 100% 40%; animation: iptails 1.5s ease-in-out infinite; }
.hs-iop .p-hair { transform-origin: 50% 100%; animation: iphair 1.3s ease-in-out infinite; }
.hs-iop .p-sword { transform-origin: 50% 85%; animation: ipsword 3.2s ease-in-out infinite; }
.hs-iop .p-sun { transform-origin: 50% 50%; animation: ipsun 3s ease-in-out infinite; }
.hs-iop .p-flame { transform-origin: 50% 85%; opacity: var(--rage, 0); transition: opacity .5s; animation: ipflame 1s ease-in-out infinite; }
.hs-iop .p-edge { opacity: calc(.2 + var(--rage, 0) * .8); }
@keyframes ipcape { 50% { transform: rotate(-3.5deg) skewY(1.2deg); } }
@keyframes iptails { 50% { transform: rotate(5deg) translateY(1px); } }
@keyframes iphair { 33% { transform: scale(1.015, 1.045) rotate(.6deg); } 66% { transform: scale(.995, .985) rotate(-.7deg); } }
@keyframes ipsword { 50% { transform: rotate(-1.6deg); } }
@keyframes ipsun { 50% { transform: scale(1.06); filter: brightness(1.15); } }
@keyframes ipflame { 40% { transform: scale(1.04, 1.07); } 70% { transform: scale(.98, 1.02); } }
/* Attaque : grand coup d'épée par-dessus l'épaule, croissant de lumière, cape et cheveux fouettés */
.hero.atk .hs-iop .p-sword { animation: ipa-sword .55s cubic-bezier(.45, 0, .2, 1); }
.hero.atk .hs-iop .p-torso { animation: ipa-torso .55s cubic-bezier(.45, 0, .2, 1); }
.hero.atk .hs-iop .p-face { animation: ipa-face .55s cubic-bezier(.45, 0, .2, 1); }
.hero.atk .hs-iop .p-cape { animation: ipa-cape .55s ease-out; }
.hero.atk .hs-iop .p-hair { animation: ipa-hair .55s ease-out; }
.hero.atk .hs-iop .p-tails { animation: ipa-tails .55s ease-out; }
.hero.atk .hs-iop .p-slash { animation: ipa-slash .55s ease-out; }
.hero.atk .hs-iop .p-flame { animation: none; transform: scale(1.08, 1.12); }
@keyframes ipa-sword { 0% { transform: rotate(0); } 22% { transform: rotate(-60deg); } 46% { transform: rotate(112deg); } 56% { transform: rotate(124deg); } 80% { transform: rotate(26deg); } 100% { transform: rotate(0); } }
@keyframes ipa-torso { 0% { transform: none; } 22% { transform: translateX(-3px) rotate(-5deg); } 46% { transform: translateX(8px) rotate(8deg) scale(1.03, .97); } 58% { transform: translateX(7px) rotate(7deg); } 100% { transform: none; } }
@keyframes ipa-face { 0%, 100% { transform: none; } 22% { transform: rotate(-4deg) translateY(1px); } 46% { transform: rotate(6deg) translateX(2px); } }
@keyframes ipa-cape { 0% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 50% { transform: rotate(11deg) skewY(3deg); } 80% { transform: rotate(-3deg); } 100% { transform: rotate(0); } }
@keyframes ipa-hair { 0% { transform: none; } 25% { transform: rotate(-3deg) scale(1.03, 1.08); } 50% { transform: rotate(5deg) scale(.96, .95); } 100% { transform: none; } }
@keyframes ipa-tails { 0% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 50% { transform: rotate(14deg) scaleX(1.12); } 100% { transform: rotate(0); } }
@keyframes ipa-slash { 0%, 40% { opacity: 0; transform: scale(.6) rotate(-14deg); } 52% { opacity: .95; transform: scale(1.02) rotate(0); } 100% { opacity: 0; transform: scale(1.12) rotate(10deg); } }
/* Soutien : l'épée se brandit */

@keyframes ipraise { 0% { transform: rotate(0); } 40% { transform: rotate(-16deg) translateY(-6px); filter: drop-shadow(0 0 6px #ffb02e); } 100% { transform: rotate(0); } }
/* Colère de Iop : l'épée se lève, puis s'abat */
.hero.cl-charge .hs-iop .p-sword { animation: none; transform: rotate(-22deg) translateY(-4px); filter: drop-shadow(0 0 7px #ffb02e) drop-shadow(0 0 14px #ff4a1a); }
.hero.cl-charge .hs-iop .p-flame { opacity: 1; animation: ipflame .35s ease-in-out infinite; }
.hero.cl-release .hs-iop .p-sword { animation: ipa-sword .5s cubic-bezier(.45, 0, .2, 1); }
.hero.cl-release .hs-iop .p-slash { animation: ipa-slash .5s ease-out; }

/* C — Plongeon : saut très haut, l'épée dressée, puis estoc vers le bas avec impact */
.hero.atk-c .hs-iop { animation: ipc-jump .64s cubic-bezier(.4, 0, .3, 1); }

.hero.atk-c .hs-iop .p-hair { animation: ipc-hair .64s ease-out; }
.hero.atk-c .hs-iop .p-cape { animation: ipc-cape .64s ease-out; }
.hero.atk-c .hs-iop .p-slash { animation: ipa-slash .64s ease-out .12s; }
@keyframes ipc-jump { 0% { transform: none; } 16% { transform: translateY(3px) scale(1.06, .93); } 38% { transform: translateY(-34px) scale(.95, 1.07); } 56% { transform: translateY(-38px) rotate(-5deg); } 74% { transform: translateY(3px) translateX(10px) rotate(8deg) scale(1.1, .88); } 88% { transform: translateY(-3px) scale(.99, 1.02); } 100% { transform: none; } }
@keyframes ipc-sword { 0% { transform: rotate(0); } 16% { transform: rotate(-24deg); } 38%, 56% { transform: rotate(-128deg); } 72% { transform: rotate(152deg); } 90% { transform: rotate(130deg); } 100% { transform: rotate(0); } }

@keyframes ipc-cape { 0% { transform: rotate(0); } 38% { transform: rotate(-14deg) skewY(-4deg); } 74% { transform: rotate(12deg); } 100% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { .ip-ghost, .ip-wave, .ip-ember { display: none; } }

.unit.hero.cl-leap { z-index: 21; }
.unit.hero.cl-leap .sprite { scale: 1.12; filter: drop-shadow(0 0 12px #ff4a1a) drop-shadow(0 0 26px #ff8a2a) brightness(1.18); animation: clleap 1.55s cubic-bezier(.45, 0, .25, 1) both; }
@keyframes clleap {
  0% { transform: translateY(0) scale(1); } 10% { transform: translateY(5px) scale(1.1, .88); }

  72% { transform: translateY(8px) translateX(14px) scale(1.2, .8) rotate(10deg); } 80% { transform: translateY(-9px) scale(.97, 1.05); }
  100% { transform: none; } }

@keyframes clslash { 0%, 66% { opacity: 0; transform: scale(.5) rotate(-40deg); } 72% { opacity: 1; transform: scale(1.3) rotate(40deg); } 90% { opacity: .6; transform: scale(1.6) rotate(110deg); } 100% { opacity: 0; } }

.hero.cl-leap .hs-iop .p-hair { animation: ipc-hair 1.55s ease-out both; }
.cl-ghost { position: absolute; pointer-events: none; z-index: 20; opacity: 0; filter: sepia(1) saturate(7) hue-rotate(-25deg) brightness(1.3); animation: clghost .6s ease-out both; }

/* ===================== Sram : assassin des ombres (sprite de combat) ===================== */
.hs-sram .p-cape { transform-origin: 90% 10%; animation: srcape 2.4s ease-in-out infinite; }
.hs-sram .p-scarf { transform-origin: 100% 40%; animation: srscarf 1.5s ease-in-out infinite; }
.hs-sram .p-hoodtip { transform-origin: 100% 70%; animation: srhood 2.8s ease-in-out infinite; }
.hs-sram .p-dagger { transform-origin: 50% 82%; animation: srdag 3.2s ease-in-out infinite; }
.hs-sram .p-dagger2 { transform-origin: 50% 90%; animation: srdag2 3.8s ease-in-out infinite; }
.hs-sram .p-poison { animation: srpoison 1.8s ease-in-out infinite; }
.hs-sram .p-drip { animation: srdrip 2.2s ease-in infinite; }
.hs-sram .p-mist { transform-origin: 50% 100%; animation: srmist 3.6s ease-in-out infinite; }
.hs-sram .p-eye { filter: drop-shadow(0 0 3px #9bff3a); }
.hs-sram .p-slash, .hs-sram .p-slash2 { transform-origin: 20% 60%; }
@keyframes srcape { 50% { transform: rotate(-2.6deg) skewY(-1.2deg); } }
@keyframes srscarf { 0%, 100% { transform: rotate(0) scaleX(1); } 50% { transform: rotate(-6deg) scaleX(.93); } }
@keyframes srhood { 50% { transform: rotate(-5deg) translateY(1px); } }
@keyframes srdag { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(3deg); } 72% { transform: rotate(-5deg); } }

@keyframes srpoison { 50% { opacity: .45; } }
@keyframes srdrip { 0%, 40% { transform: translateY(0) scale(.6); opacity: 0; } 55% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(16px) scale(.7); opacity: 0; } }
@keyframes srmist { 50% { transform: scaleX(1.08) translateY(-1px); opacity: .75; } }
/* A — Fente croisée : bond en avant, les deux lames se croisent */
.hero.atk-a .hs-sram { animation: sra-lunge .6s cubic-bezier(.45, 0, .2, 1); }
.hero.atk-a .hs-sram .p-dagger { animation: sra-dag .6s cubic-bezier(.45, 0, .2, 1); }
.hero.atk-a .hs-sram .p-dagger2 { animation: sra-dag2 .6s cubic-bezier(.45, 0, .2, 1); }
.hero.atk-a .hs-sram .p-slash { animation: sra-slash .6s ease-out; }
.hero.atk-a .hs-sram .p-slash2 { animation: sra-slash .6s ease-out .05s; }
.hero.atk-a .hs-sram .p-cape, .hero.atk-b .hs-sram .p-cape, .hero.atk-c .hs-sram .p-cape { animation: srcape-a .6s ease-out; }
.hero.atk-a .hs-sram .p-scarf, .hero.atk-b .hs-sram .p-scarf, .hero.atk-c .hs-sram .p-scarf { animation: srscarf-a .6s ease-out; }
@keyframes sra-lunge { 0% { transform: none; } 22% { transform: translateX(-6px) rotate(-2deg) scale(.97, 1.03); } 42% { transform: translateX(30px) skewX(-9deg) scale(1.06, .96); } 64% { transform: translateX(28px) skewX(-4deg); } 100% { transform: none; } }

@keyframes sra-slash { 0%, 36% { opacity: 0; transform: scale(.5) rotate(-30deg); } 46% { opacity: 1; transform: scale(1.15) rotate(24deg); } 100% { opacity: 0; transform: scale(1.5) rotate(90deg); } }
@keyframes srcape-a { 0% { transform: none; } 40% { transform: rotate(8deg) skewY(3deg) scaleX(1.12); } 100% { transform: none; } }
@keyframes srscarf-a { 0% { transform: none; } 40% { transform: rotate(10deg) scaleX(1.25); } 100% { transform: none; } }
/* B — Pas d'ombre : il se dissout, réapparaît devant l'ennemi et frappe */
.hero.atk-b .hs-sram { animation: srb-step .64s cubic-bezier(.4, 0, .25, 1); }

.hero.atk-b .hs-sram .p-slash { animation: sra-slash .64s ease-out .08s; }

@keyframes src-rush { 0% { transform: none; } 20% { transform: translateX(10px) rotate(2deg); } 40% { transform: translateX(6px) rotate(-1deg); } 62% { transform: translateX(18px) scale(1.05, .97); } 100% { transform: none; } }

/* ---------------------------- Courbes ---------------------------- */
function xpToNext(lvl) { return 2 * Math.floor((16 * Math.pow(lvl, 2.25) + 20 * lvl) * (1 + Math.pow(lvl / 35, 2))); }
function jobXpToNext(lvl) { return Math.floor(40 * Math.pow(lvl, 1.7)); }

const _monCache = {};
function monsterStats(mid) {
  if (_monCache[mid]) return _monCache[mid];
  const m = MONSTERS[mid]; const l = m.lvl;
  const hp = Math.round((12 + l * 8 + l * l * 0.12) * (m.hpm || 1));
  const avg = (2.5 + l * 0.8 + l * l * 0.003) * (m.dm || 1);
  const xp = Math.round((10 + l * 6 + l * l * 1.9) * (m.hpm || 1) * (m.boss ? 1.5 : 1));
  const kamas = [Math.round(l * 1.5 + 2), Math.round(l * 3 + 6)].map(k => m.boss ? k * 8 : k);
  return (_monCache[mid] = { hp, dmin: Math.max(1, Math.round(avg * 0.8)), dmax: Math.round(avg * 1.2), xp, kamas, res: m.res || 0 });
}

function newHero(st, name, cls) {
  const h = {
    id: uid(), name, cls, lvl: 1, xp: 0, capital: 0, auto: CLASSES[cls].main,
    base: { vit: 0, sag: 0, deg: 0 },
    equip: {}, hp: 0, act: null, fight: null, wait: 0, restTotal: 0, resting: false,
    log: [], session: null,
  };
  h.hp = heroTotals(st, h).maxHp;
  return h;
}

function maxHeroLevel(s) { return s.heroes.reduce((m, h) => Math.max(m, h.lvl), 0); }
function maxSetCount(s) {
  let best = 0;
  for (const h of s.heroes) for (const c of Object.values(setCounts(s, h))) best = Math.max(best, c);
  return best;
}
function gearById(st, id) { return st.gear.find(g => g.uid === id); }
function setCounts(st, h) {
  const c = {};
  for (const slot of SLOTS) {
    const g = h.equip[slot] && gearById(st, h.equip[slot]);
    if (g && ITEMS[g.id].set) c[ITEMS[g.id].set] = (c[ITEMS[g.id].set] || 0) + 1;
  }
  return c;
}
function setBonus(setId, count) {
  const b = SETS[setId].bonus; let best = null;
  for (const k of Object.keys(b)) if (count >= +k) best = b[k];
  return best || {};
}

/* Statistiques totales d'un héros (base + équipement + panoplies + passif) */
function heroTotals(st, h) {
  const t = { vit: 0, sag: 0, deg: 0, res: 0, pp: 0, crit: 0, soin: 0, dmg: 0, pa: 0, kamas: 0 };
  for (const s of STATS) t[s] += h.base[s];
  for (const slot of SLOTS) {
    const g = h.equip[slot] && gearById(st, h.equip[slot]);
    if (g) for (const [k, v] of Object.entries(g.stats)) t[k] = (t[k] || 0) + v;
  }
  for (const [set, n] of Object.entries(setCounts(st, h))) for (const [k, v] of Object.entries(setBonus(set, n))) t[k] = (t[k] || 0) + v;
  if (h.food && h.food.left > 0 && RESOURCES[h.food.id]) { const f = RESOURCES[h.food.id].food; if (f.speed) t.speed = (t.speed || 0) + f.speed; }
  const rel = h.relic && gearById(st, h.relic);
  if (rel) for (const [k, v] of Object.entries(rel.stats)) t[k] = (t[k] || 0) + v;
  const cl = CLASSES[h.cls];
  if (cl.passive && cl.passive.stats) for (const [k, v] of Object.entries(cl.passive.stats)) t[k] = (t[k] || 0) + v;
  t.maxHp = Math.round((50 + h.lvl * 6) * cl.hpMult + t.vit);
  t.pa = 6 + (h.lvl >= 100 ? 1 : 0) + t.pa;
  t.critPct = clamp(3 + t.crit, 0, 50);
  t.dodgePct = clamp(t.dodge || 0, 0, 35);
  t.resPct = clamp(t.res, 0, 50);
  t.ppTotal = 100 + t.pp;
  t.xpBonus = Math.round((t.sag * SAG_XP + (t.xpPct || 0)) * 10) / 10;
  return t;
}

function spellsOf(h) { return CLASSES[h.cls].spells; }
function spellUnlocked(h, sp) { return h.lvl >= sp.lvl; }
