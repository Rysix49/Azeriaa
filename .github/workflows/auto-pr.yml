# Ouvre automatiquement la demande de fusion dev -> main à chaque envoi sur dev,
# pour que le bouton « Publier sur le site officiel » mène directement au bouton « Merge ».
name: Demande de fusion automatique
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir la demande dev -> main si besoin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Ne fait jamais échouer le déploiement : au pire, un simple avertissement.
          OWNER="${REPO%%/*}"
          OPEN=$(gh api "repos/$REPO/pulls?state=open&base=main&head=$OWNER:dev" -q 'length' 2>/dev/null || echo "?")
          if [ "$OPEN" != "0" ]; then echo "Demande déjà ouverte (ou liste illisible : $OPEN)."; exit 0; fi
          AHEAD=$(gh api "repos/$REPO/compare/main...dev" -q .ahead_by 2>/dev/null || echo 0)
          if [ "$AHEAD" = "0" ]; then echo "Rien de nouveau sur dev."; exit 0; fi
          if gh api -X POST "repos/$REPO/pulls" -f head=dev -f base=main \
               -f title="Publier les nouveautés de dev" \
               -f body="Demande ouverte automatiquement. Clique sur « Merge pull request » puis « Confirm merge » pour publier sur le site officiel." >/dev/null 2>&1; then
            echo "Demande de fusion ouverte."
          else
            echo "::warning::Impossible d'ouvrir la demande automatiquement. Active Settings > Actions > General > « Allow GitHub Actions to create and approve pull requests », ou ouvre-la avec le bouton Publier."
          fi
          exit 0
