# Ouvre automatiquement la demande de fusion dev -> main à chaque envoi sur dev,
# pour que le bouton « Publier sur le site officiel » mène directement au bouton « Merge ».
name: Demande de fusion automatique
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir la demande dev -> main si besoin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$(gh pr list -R "$REPO" --head dev --base main --state open --json number -q '.[].number')" ]; then
            echo "Demande déjà ouverte."; exit 0
          fi
          AHEAD=$(gh api "repos/$REPO/compare/main...dev" -q .ahead_by)
          [ "$AHEAD" = "0" ] && { echo "Rien de nouveau sur dev."; exit 0; }
          gh pr create -R "$REPO" --base main --head dev \
            --title "Publier les nouveautés de dev" \
            --body "Demande ouverte automatiquement. Clique sur « Merge pull request » puis « Confirm merge » pour publier sur le site officiel."
