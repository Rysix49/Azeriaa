[build]
  # Le site est désormais hébergé sur Cloudflare Pages : Netlify ignore toutes les nouvelles versions
  # (l'ancien site reste en ligne pour le rapatriement des comptes, sans consommer de crédits de déploiement).
  ignore = "exit 0"
  publish = "."
  functions = "netlify/functions"

# Adresse courte du site de test : azeriaa.netlify.app/test
# (mise à jour à chaque nouvelle demande de fusion dev -> main : deploy-preview-8<numéro>)
[[redirects]]
  from = "/test"
  to = "https://deploy-preview-8--azeriaa.netlify.app/"
  status = 302
  force = true
